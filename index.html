<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Cairo',sans-serif;background:#f4f6f4;color:#0f172a;direction:rtl;}
:root{--red:#b81d22;--green:#1b5e2e;--light-green:#2d7a40;--dark:#0f172a;--gold:#d4af37;}

/* شريط التنقل */
@keyframes splashIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#cdSecs{animation:pulse 1s ease infinite;}
#countdownGrid{animation:fadeUp .6s .5s ease both;}
@keyframes dot{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
.navbar{background:linear-gradient(135deg,#0d3318,#1b5e2e);padding:0 16px;height:70px;display:flex;align-items:center;justify-content:space-between;position:fixed;top:0;left:0;right:0;z-index:100;border-bottom:3px solid #d4af37;box-shadow:0 2px 12px rgba(0,0,0,.3);}
.nav-brand{display:flex;align-items:center;gap:10px;}
.nav-logo{width:36px;height:36px;background:var(--red);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff;flex-shrink:0;letter-spacing:-1px;}
.nav-title{font-size:14px;font-weight:900;color:#fff;letter-spacing:-.2px;}
.nav-sub{font-size:9px;color:rgba(255,255,255,.7);font-weight:700;letter-spacing:.5px;}
.nav-btns{display:flex;gap:8px;}
.nav-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;padding:6px 12px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;}
.nav-btn.gold{background:var(--red);border-color:var(--red);color:#fff;}

/* المحتوى */
#app{margin-top:56px;min-height:calc(100vh - 56px);}

/* البطل */
.hero{background:linear-gradient(160deg,#0d3318 0%,#1b5e2e 60%,#0d3318 100%);padding:20px 20px 20px;text-align:center;position:relative;overflow:hidden;min-height:calc(100vh - 70px);display:flex;flex-direction:column;justify-content:center;}
.hero::before{content:'';position:absolute;inset:0;background:url('hero_bg.jpg') center 20%/cover no-repeat;opacity:0.2;pointer-events:none;}
.hero-badge{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:11px;font-weight:800;padding:4px 14px;border-radius:20px;margin-bottom:16px;letter-spacing:.5px;}
.hero h1{font-size:26px;font-weight:900;color:#fff;margin-bottom:6px;position:relative;animation:fadeUp .6s ease both;}
.hero h1 span{color:#ffdd57;}
.hero p{font-size:12px;color:rgba(255,255,255,.75);font-weight:600;margin-bottom:24px;position:relative;animation:fadeUp .6s .15s ease both;}
.hero-stats{display:flex;justify-content:center;gap:24px;position:relative;animation:fadeUp .6s .3s ease both;}
.hstat{text-align:center;}
.hstat-n{animation:popIn .5s .45s ease both;display:block;}
.hstat-n{font-size:22px;font-weight:900;color:#ffdd57;}
.hstat-l{font-size:10px;color:rgba(255,255,255,.6);font-weight:600;}

/* الأقسام */
.section{padding:16px;animation:fadeUp .5s .4s ease both;}
.bn-btn{flex:1;padding:10px 4px;text-align:center;cursor:pointer;border:none;background:none;font-family:'Cairo',sans-serif;transition:transform .15s ease;}
.bn-btn:active{transform:scale(.9);}
.sec-title{font-size:14px;font-weight:900;color:var(--dark);margin-bottom:12px;display:flex;align-items:center;gap:8px;border-bottom:2px solid #e2e8f0;padding-bottom:8px;}

/* بطاقات الفئات */
.cats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
.cat-card{background:#fff;border-radius:14px;padding:14px;border-top:3px solid var(--green);box-shadow:0 2px 8px rgba(0,0,0,.06);}
.cat-name{font-size:12px;font-weight:900;color:var(--dark);margin-bottom:4px;}
.cat-years{font-size:10px;color:#64748b;font-weight:600;line-height:1.6;}
.cat-extra{font-size:9px;color:var(--green);font-weight:700;margin-top:4px;}

/* بطاقات الأكاديميات */
.acad-card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;align-items:center;gap:12px;}
.acad-avatar{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--green),#0d3318);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;flex-shrink:0;}
.acad-info{flex:1;}
.acad-name{font-size:13px;font-weight:900;color:var(--dark);}
.acad-meta{font-size:10px;color:#64748b;font-weight:600;margin-top:2px;}
.acad-cats{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.cat-pill{font-size:9px;font-weight:700;padding:2px 8px;border-radius:10px;background:#f0fdf4;color:var(--green);}

/* الأزرار */
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:14px;font-weight:900;cursor:pointer;font-family:'Cairo',sans-serif;text-align:center;}
.btn-red{background:linear-gradient(135deg,var(--red),#7a0f12);color:#fff;}
.btn-green-main{background:linear-gradient(135deg,var(--green),#0d3318);color:#fff;}
.btn-gold{background:linear-gradient(135deg,var(--gold),#b8960c);color:var(--dark);}
.btn-dark{background:linear-gradient(135deg,var(--dark),#1e293b);color:#fff;}
.btn-light{background:#f1f5f9;color:#475569;}
.btn-green{background:linear-gradient(135deg,#128c7e,#25d366);color:#fff;}
.btn+.btn{margin-top:8px;}

/* النماذج */
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:12px;}
.lbl{display:block;font-size:11px;font-weight:800;color:#374151;margin-bottom:5px;}
.inp{width:100%;border:1.5px solid #e2e8f0;border-radius:10px;padding:11px 13px;font-size:13px;font-family:'Cairo',sans-serif;color:var(--dark);background:#fff;outline:none;transition:border .2s;}
.inp:focus{border-color:var(--red);}
.mb{margin-bottom:12px;}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.err{color:#b91c1c;font-size:11px;font-weight:700;margin-top:4px;}
.ok{color:#16a34a;font-size:11px;font-weight:700;margin-top:4px;}

/* التنبيهات */
.al{border-radius:10px;padding:10px 14px;font-size:12px;font-weight:700;margin-bottom:10px;}
.al-ok{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;}
.al-err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;}
.al-warn{background:#fffbeb;color:#d97706;border:1px solid #fde68a;}

/* لودينج */
.ldg{display:flex;justify-content:center;padding:40px;}
.sp{width:32px;height:32px;border:3px solid #e2e8f0;border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* الموديل */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:480px;padding:20px 16px 32px;max-height:85vh;overflow-y:auto;}
.modal-handle{width:40px;height:4px;background:#e2e8f0;border-radius:2px;margin:0 auto 18px;}
.modal-title{font-size:16px;font-weight:900;color:var(--dark);margin-bottom:16px;text-align:center;}

/* بطاقة اللاعب */
.player-card{background:linear-gradient(135deg,#0f172a,#1e293b);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
.player-num{width:32px;height:32px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:var(--dark);flex-shrink:0;}
.player-info{flex:1;}
.player-name{font-size:12px;font-weight:900;color:#fff;}
.player-meta{font-size:10px;color:rgba(255,255,255,.55);font-weight:600;}
.player-cat{font-size:9px;font-weight:800;padding:2px 8px;border-radius:8px;background:rgba(212,175,55,.2);color:var(--gold);}

/* الشريط السفلي */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;display:flex;z-index:100;}
.bn-icon{font-size:18px;display:block;margin-bottom:2px;}
.bn-label{font-size:9px;color:#94a3b8;font-weight:700;}
.bn-btn.active .bn-label{color:var(--red);}
.bn-btn.active .bn-icon{filter:drop-shadow(0 0 4px var(--red));}
#app{padding-bottom:64px;}

/* شارة الحالة */
.status-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:800;}
.status-open{background:#dcfce7;color:#16a34a;}
.status-closed{background:#fee2e2;color:#b91c1c;}

/* قسم الفئة في إدارة الأكاديمية */
.cat-section{background:#f8fafc;border-radius:12px;padding:12px;margin-bottom:10px;border:1.5px solid #e2e8f0;}
.cat-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.cat-count{background:var(--red);color:#fff;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;}
</style>
</head>

  var d = new Date(birthDateStr);

  var y = d.getFullYear();

  return null;

function apiCall(action, data) {
  // للتوافق مع الكود القديم
  if(data && data.sheet && data.data) {
    return apiAppend(data.sheet, Array.isArray(data.data)?data.data[0]:data.data);
  }
  return apiAppend(
    action==='registerAcademy'?'الأكاديميات':action==='addPlayer'?'اللاعبون':'رسائل البطولة',
    data
  );
}

function apiAppend(sheet, rowObj) {
  if(CONFIG.GAS_URL === 'YOUR_GAS_URL_HERE') return Promise.resolve({status:'demo'});
  return fetch(CONFIG.GAS_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type': 'text/plain'},
    body: JSON.stringify({action:'append', sheet:sheet, data:[rowObj]})
  }).then(function(){ return {status:'ok'}; })
    .catch(function(){ return {status:'error'}; });
}

var _cache = {};
var _CACHE_TTL = 3 * 60 * 1000; // 3 دقائق

function apiGet(sheet, forceRefresh) {
  if(CONFIG.GAS_URL === 'YOUR_GAS_URL_HERE') return getDemoData(sheet);
  var now = Date.now();
  if(!forceRefresh && _cache[sheet] && (now - _cache[sheet].t) < _CACHE_TTL) {
    return Promise.resolve(_cache[sheet].d);
  }
  return fetch(CONFIG.GAS_URL+'?sheet='+encodeURIComponent(sheet)+'&t='+now)
    .then(function(r){return r.json();})
    .then(function(d){ _cache[sheet]={d:d,t:Date.now()}; return d; })
    .catch(function(){ return _cache[sheet]?_cache[sheet].d:[]; });
}

function invalidateCache(sheet){ delete _cache[sheet]; }

function fmtDate(v){
  if(!v) return '';
  var s=String(v);
  var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[3]+'/'+m[2]+'/'+m[1];
  return s;
}
function fmtTime(v){
  if(!v) return '';
  var s=String(v);
  var m=s.match(/T(\d{2}):(\d{2})/);
  if(m) return m[1]+':'+m[2];
  if(/^\d{2}:\d{2}/.test(s)) return s.slice(0,5);
  return s;
}

// بعد كل كتابة، امسح cache الشيت المعني
var _origApiAppend = null;
function apiAppend(sheet, rowObj) {
  if(CONFIG.GAS_URL === 'YOUR_GAS_URL_HERE') return Promise.resolve({status:'demo'});

    body: JSON.stringify({action:'append', sheet:sheet, data:[rowObj]})

    .catch(function(){ return {status:'error'}; });
}

    function updateCountdown(){
      var deadline = new Date('2026-08-06T00:00:00');
      var now = new Date();
      var diff = deadline - now;
      if(diff <= 0){
        ['cdDays','cdHours','cdMins','cdSecs'].forEach(function(id){
          var el=document.getElementById(id); if(el) el.textContent='0';
        });
        var el=document.getElementById('homeCountdown'); if(el) el.textContent='0';
        return;
      }
      var days  = Math.floor(diff/(1000*60*60*24));
      var hours = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
      var mins  = Math.floor((diff%(1000*60*60))/(1000*60));
      var secs  = Math.floor((diff%(1000*60))/1000);
      var d=document.getElementById('cdDays');     if(d) d.textContent=days;
      var h=document.getElementById('cdHours');    if(h) h.textContent=String(hours).padStart(2,'0');
      var m=document.getElementById('cdMins');     if(m) m.textContent=String(mins).padStart(2,'0');
      var s=document.getElementById('cdSecs');     if(s) s.textContent=String(secs).padStart(2,'0');
      var hc=document.getElementById('homeCountdown'); if(hc) hc.textContent=days;
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);
  });
}

function submitAcadReg() {
  var name    = (document.getElementById('rAcadName').value||'').trim();
  var city    = (document.getElementById('rCity').value||'').trim();
  var country = (document.getElementById('rCountry').value||'').trim();
  var coach   = (document.getElementById('rCoach').value||'').trim();
  var phone   = (document.getElementById('rPhone').value||'').trim();
  var email   = (document.getElementById('rEmail').value||'').trim();
  var pin     = (document.getElementById('rPin').value||'').trim();
  var pin2    = (document.getElementById('rPin2').value||'').trim();
  var cats    = CATEGORIES.filter(function(c){return document.getElementById('rCat_'+c.id).checked;}).map(function(c){return c.id;});
  var errEl   = document.getElementById('rErr');

  errEl.style.display='none';
  if(!name||!city||!country||!coach||!phone){errEl.textContent='الرجاء ملء جميع الحقول الإلزامية';errEl.style.display='block';return;}
  if(!cats.length){errEl.textContent='اختر فئة عمرية واحدة على الأقل';errEl.style.display='block';return;}
  if(pin.length!==4||isNaN(pin)){errEl.textContent='الرمز السري يجب أن يكون 4 أرقام';errEl.style.display='block';return;}
  if(pin!==pin2){errEl.textContent='كلمة المرور غير متطابقة';errEl.style.display='block';return;}

  var id = 'AC'+Date.now().toString().slice(-6);
  var btn = document.querySelector('.btn-red');

  var catLabels = cats.map(function(cid){var c=CATEGORIES.find(function(x){return x.id===cid;});return c?c.name:cid;}).join('، ');
  var adminMsg = 'طلب تسجيل: '+name+' | '+city+' | '+coach+' | '+phone+' | ID: '+id;

  apiAppend('الأكاديميات',{

    coach:coach, phone:phone, email:email,
    cats:cats.join(','), pin:pin, players:'0',

  }).then(function(){
    sessionStorage.setItem('kaasAcadId', id);
    sessionStorage.setItem('kaasAcadName', name);
    sessionStorage.setItem('kaasAcadPin', pin);
    document.getElementById('app').innerHTML =
      '<div style="text-align:center;padding:40px 16px;">'+
        '<div style="font-size:64px;margin-bottom:16px;">🎉</div>'+
        '<div style="font-size:20px;font-weight:900;color:#16a34a;margin-bottom:6px;">تم إرسال طلب التسجيل!</div>'+
        '<div style="font-size:13px;color:#64748b;margin-bottom:6px;">'+name+'</div>'+
        '<div style="background:#fef9c3;border:1.5px solid #fde68a;border-radius:12px;padding:14px;margin:16px auto;max-width:320px;">'+
          '<div style="font-size:12px;font-weight:800;color:#92400e;margin-bottom:4px;"><i class="fas fa-clock"></i> قيد الاعتماد</div>'+
          '<div style="font-size:11px;color:#78350f;">طلبك تحت المراجعة، ستُبلَّغ بقرار الإدارة.</div>'+

        '</div>'+

function doAcadLogin() {
  var phone = (document.getElementById('loginPhone').value||'').trim();
  var pin   = (document.getElementById('loginPin').value||'').trim();
  var err   = document.getElementById('loginErr');
  err.style.display='none';
  if(!phone||!pin){err.textContent='أدخل رقم الهاتف والـ PIN';err.style.display='block';return;}
  var btn = document.querySelector('#app .btn-red');
  btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> جارٍ التحقق...';

  // جلب مباشر بدون كاش
  invalidateCache('الأكاديميات');
  invalidateCache('تحديث الأكاديميات');
  apiGet('الأكاديميات').then(function(list){
    var acad = list.find(function(a){return String(a.phone)===String(phone) && String(a.pin)===String(pin);});
    btn.disabled=false; btn.innerHTML='<i class="fas fa-sign-in-alt"></i> دخول';
    if(!acad){err.textContent='رقم الهاتف أو الـ PIN غير صحيح';err.style.display='block';return;}

    // فحص الاعتماد من جدول التحديثات (الأكثر موثوقية)
    apiGet('تحديث الأكاديميات').then(function(updates){
      var latest = (updates||[]).filter(function(u){return String(u.academy_id)===String(acad.id);}).pop();
      var status = (latest && latest.status) || acad.status || 'قيد الاعتماد';
      if(status !== 'معتمد'){
        document.getElementById('app').innerHTML=
          '<div style="text-align:center;padding:60px 20px;max-width:360px;margin:0 auto;">'+
            '<div style="font-size:64px;margin-bottom:16px;">⏳</div>'+
            '<div style="font-size:18px;font-weight:900;color:#92400e;margin-bottom:8px;">طلبك قيد المراجعة</div>'+
            '<div style="background:#fef9c3;border:1.5px solid #fde68a;border-radius:12px;padding:16px;margin:16px auto;max-width:300px;">'+
              '<div style="font-size:12px;color:#78350f;font-weight:700;margin-bottom:6px;">'+acad.name+'</div>'+
              '<div style="font-size:11px;color:#92400e;">لم يتم اعتماد أكاديميتك بعد من قبل الإدارة.<br>سيتم إبلاغكم بقرار الاعتماد عبر واتساب.</div>'+
            '</div>'+
            '<button class="btn btn-light" style="max-width:300px;margin:0 auto;" onclick="go(\'acad_login\')">رجوع</button>'+
          '</div>';
        return;
      }
      sessionStorage.setItem('kaasAcadId',acad.id);
      sessionStorage.setItem('kaasAcadName',acad.name);
      sessionStorage.setItem('kaasAcadCats',acad.cats||'');
      window._kaasAcad = acad;
      go('acad_dashboard');
    });
  });
}

/* ────── محرر الصورة (اسحب + اقرص) ────── */
function openPhotoCropper(input){
  var file = input.files[0];
  if(!file) return;
  var url = URL.createObjectURL(file);
  _showCropper(url, function(res){
    URL.revokeObjectURL(url);
    window._playerPhoto = res;
    var box = document.getElementById('photoPreview');
    if(box){ box.style.border='3px solid #d4af37'; box.innerHTML='<img src="'+res+'" style="width:100%;height:100%;object-fit:cover;">'; }
    var eb = document.getElementById('photoEditBtn');
    if(eb) eb.style.display='block';
  });
}

/* ─── محرر قص الصورة (Canvas) ─── */
function _showCropper(src, onConfirm){
  var SZ = 280;
  var image = new Image();
  image.onload = function(){
    var ov = document.createElement('div');
    ov.id = 'cropModal';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-family:Cairo,sans-serif;direction:rtl;';
    ov.innerHTML =
      '<div style="color:#d4af37;font-size:15px;font-weight:900;margin-bottom:18px;">📷 اضبط الصورة</div>'+
      '<canvas id="cropCvs" width="'+SZ+'" height="'+SZ+'" style="border-radius:50%;border:4px solid #d4af37;touch-action:none;display:block;"></canvas>'+
      '<div style="color:rgba(255,255,255,.45);font-size:11px;margin:14px 0;text-align:center;">اسحب بإصبع · اقرص بإصبعين للتكبير</div>'+
      '<div style="display:flex;gap:12px;">'+
        '<button id="cropOk" style="background:#d4af37;color:#0f172a;border:none;border-radius:12px;padding:13px 32px;font-size:14px;font-weight:900;cursor:pointer;font-family:Cairo,sans-serif;">✅ تأكيد</button>'+
        '<button id="cropCancel" style="background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:12px;padding:13px 24px;font-size:13px;cursor:pointer;font-family:Cairo,sans-serif;">إلغاء</button>'+
      '</div>';
    document.body.appendChild(ov);

    var cvs = document.getElementById('cropCvs');
    var ctx = cvs.getContext('2d');
    var minSc = Math.max(SZ/image.naturalWidth, SZ/image.naturalHeight);
    var sc = minSc;
    var tx = (SZ - image.naturalWidth*sc)/2;
    var ty = (SZ - image.naturalHeight*sc)/2;

    function draw(){
      ctx.clearRect(0,0,SZ,SZ);
      ctx.drawImage(image, tx, ty, image.naturalWidth*sc, image.naturalHeight*sc);
    }
    draw();

    // touch
    var lx=0,ly=0,ltx=0,lty=0,ld=0,ls=1;
    cvs.addEventListener('touchstart',function(e){
      e.preventDefault();
      if(e.touches.length===1){ lx=e.touches[0].clientX; ly=e.touches[0].clientY; ltx=tx; lty=ty; }
      else if(e.touches.length===2){
        ld=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);
        ls=sc; ltx=tx; lty=ty;
      }
    },{passive:false});
    cvs.addEventListener('touchmove',function(e){
      e.preventDefault();
      if(e.touches.length===1){
        tx=ltx+(e.touches[0].clientX-lx);
        ty=lty+(e.touches[0].clientY-ly);
        draw();
      } else if(e.touches.length===2 && ld){
        var d=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);
        sc=Math.max(minSc,ls*(d/ld));
        tx=SZ/2-(SZ/2-ltx)*(sc/ls);
        ty=SZ/2-(SZ/2-lty)*(sc/ls);
        draw();
      }
    },{passive:false});

    // mouse
    var md=false,mx0,my0,mtx,mty;
    cvs.addEventListener('mousedown',function(e){md=true;mx0=e.clientX;my0=e.clientY;mtx=tx;mty=ty;});
    document.addEventListener('mousemove',function(e){if(!md)return;tx=mtx+(e.clientX-mx0);ty=mty+(e.clientY-my0);draw();});
    document.addEventListener('mouseup',function(){md=false;});

    document.getElementById('cropCancel').onclick=function(){ ov.remove(); };
    document.getElementById('cropOk').onclick=function(){
      var out=document.createElement('canvas'); out.width=200; out.height=200;
      var octx=out.getContext('2d');
      octx.beginPath(); octx.arc(100,100,100,0,Math.PI*2); octx.clip();
      var r=200/SZ;
      octx.drawImage(image, tx*r, ty*r, image.naturalWidth*sc*r, image.naturalHeight*sc*r);
      var res=out.toDataURL('image/jpeg',0.85);
      ov.remove();
      onConfirm(res);
    };
  };
  image.onerror=function(){ ov.remove(); showToast('تعذّر تحميل الصورة'); };
  image.src = src;
}

function showPhotoCropper(src){
  _showCropper(src, function(res){
    window._playerPhoto = res;
    var box = document.getElementById('photoPreview');
    if(box){ box.style.border='3px solid #d4af37'; box.innerHTML='<img src="'+res+'" style="width:100%;height:100%;object-fit:cover;">'; }
    var eb = document.getElementById('photoEditBtn');
    if(eb) eb.style.display='block';
  });
}

function loadPlayerDoc(input){
  var file=input.files[0];
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var MAX=800, ratio=Math.min(MAX/img.width,MAX/img.height,1);
      var c=document.createElement('canvas');
      c.width=Math.round(img.width*ratio); c.height=Math.round(img.height*ratio);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      var comp=c.toDataURL('image/jpeg',0.75);
      window._playerDoc=comp;
      var box=document.getElementById('docPreview');
      var hint=document.getElementById('docHint');
      if(box) box.innerHTML='<img src="'+comp+'" style="max-width:100%;max-height:120px;border-radius:8px;">';
      if(hint) hint.textContent='✅ تم رفع الوثيقة — اضغط لتغييرها';
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function checkPlayerCat() {
  var birth = document.getElementById('pBirth').value;
  var el = document.getElementById('catResult');
  if(!birth){el.style.display='none';return;}
  var catId = getCategory(birth);
  if(!catId){
    el.innerHTML='<div class="al al-err">❌ تاريخ الميلاد هذا لا ينتمي لأي فئة عمرية في البطولة</div>';
    el.style.display='block';return;
  }
  var cats = (sessionStorage.getItem('kaasAcadCats')||'').split(',').filter(Boolean);
  var ci = getCatInfo(catId);
  if(cats.indexOf(catId)===-1){
    el.innerHTML='<div class="al al-warn">⚠️ اللاعب ينتمي لـ <b>'+ci.name+'</b> لكن أكاديميتك لم تسجل في هذه الفئة</div>';
    el.style.display='block';return;
  }
  el.innerHTML='<div class="al al-ok">✅ الفئة: <b>'+ci.name+'</b> ('+ci.label+')</div>';
  el.style.display='block';
}

function submitPlayer() {
  var name   = (document.getElementById('pName').value||'').trim();
  var birth  = (document.getElementById('pBirth').value||'').trim();
  var nat    = (document.getElementById('pNat').value||'').trim();
  var phone  = (document.getElementById('pPhone').value||'').trim();
  var health = (document.getElementById('pHealth').value||'').trim();
  var jersey = (document.getElementById('pJersey').value||'').trim();
  var acadId   = sessionStorage.getItem('kaasAcadId');
  var acadName = sessionStorage.getItem('kaasAcadName');
  var errEl  = document.getElementById('pErr');
  errEl.style.display='none';

  if(!name||!birth||!nat||!jersey){errEl.textContent='الرجاء ملء الحقول الإلزامية (الاسم، تاريخ الميلاد، الجنسية، رقم القميص)';errEl.style.display='block';return;}
  var catId = getCategory(birth);
  if(!catId){errEl.textContent='تاريخ الميلاد لا ينتمي لأي فئة في البطولة';errEl.style.display='block';return;}
  var cats = (sessionStorage.getItem('kaasAcadCats')||'').split(',').filter(Boolean);
  if(cats.indexOf(catId)===-1){errEl.textContent='أكاديميتك غير مسجلة في فئة هذا اللاعب';errEl.style.display='block';return;}

  /* ── التحقق من رقم القميص المكرر في نفس الأكاديمية والفئة ── */
  if(jersey){
    var existing = (window._kaasPlayers||[]).find(function(p){
      return p.academy_id===acadId && p.cat_id===catId && String(p.jersey)===String(jersey);
    });
    if(existing){
      errEl.textContent='⚠️ رقم القميص '+jersey+' مسجل مسبقاً للاعب "'+existing.name+'" في نفس الفئة';
      errEl.style.display='block';
      return;
    }
  }

  /* ── معاينة البطاقة قبل الحفظ ── */
  var previewData = {
    id:'PL-PREVIEW', name:name, birth:birth, nationality:nat,
    jersey:jersey, phone:phone, health:health,
    cat_id:catId, cat_name:(getCatInfo(catId)||{}).name||'',
    academy_name:acadName, acadName:acadName, catId:catId,
    photo: window._playerPhoto||''
  };
  _showRegPreview(previewData, function(){
    _doSubmitPlayer(name, birth, nat, phone, health, jersey, catId, acadId, acadName);
  });
}

function _doSubmitPlayer(name, birth, nat, phone, health, jersey, catId, acadId, acadName){
  var playerId = 'PL'+Date.now().toString().slice(-8);
  var photo = window._playerPhoto || '';
  var doc   = window._playerDoc   || '';

  if(photo) { try{ localStorage.setItem('kaasPhoto_'+playerId, photo); }catch(e){} }
  if(doc)   { try{ localStorage.setItem('kaasDoc_'+playerId,   doc);   }catch(e){} }

  apiAppend('اللاعبون',{
    id:playerId,
    academy_id:acadId, academy_name:acadName,
    name:name, birth:birth, nationality:nat,
    jersey:jersey||'', phone:phone, health:health||'لا يوجد',
    cat_id:catId, cat_name:(getCatInfo(catId)||{}).name||'',
    has_photo: photo?'نعم':'لا',
    has_doc:   doc?'نعم':'لا',
    date:new Date().toLocaleDateString('ar')
  }).then(function(){
    var prev = document.getElementById('regPreviewModal');
    if(prev) prev.remove();
    showKaasCard({id:playerId, name:name, birth:birth, nationality:nat, jersey:jersey, phone:phone, catId:catId, acadId:acadId, acadName:acadName, photo:photo});
  });
}

function sendParentWhatsapp(){
  var p = window._kaasCardPlayer;
  if(!p || !p.phone) return;
  var ci = getCatInfo(p.catId||p.cat_id||'');
  var birth = (p.birth||'').toString().split('T')[0];
  var msg =
    '🏆 *'+CONFIG.TOURNAMENT_NAME+'*\n'+
    '─────────────────\n'+
    'السلام عليكم ورحمة الله،\n'+
    'تم تسجيل ابنك/ابنتك بنجاح في البطولة 🎉\n\n'+
    '👤 *اللاعب:* '+p.name+'\n'+
    '🎂 *تاريخ الميلاد:* '+birth+'\n'+
    (p.nationality ? '🌍 *الجنسية:* '+p.nationality+'\n' : '')+
    (ci ? '⚽ *الفئة:* '+ci.name+' ('+ci.label+')\n' : '')+
    (p.jersey ? '👕 *رقم القميص:* #'+p.jersey+'\n' : '')+
    '🏫 *الأكاديمية:* '+(p.acadName||p.academy_name||'')+'\n'+
    '🆔 *رقم اللاعب:* '+p.id+'\n'+
    '─────────────────\n'+
    '📋 *الموسم:* '+CONFIG.SEASON+'\n\n'+
    'نتمنى له التوفيق والنجاح 🌟';

  var card = document.getElementById('kaasPlayerCard');
  if(!card){
    window.open('https://api.whatsapp.com/send?phone='+p.phone+'&text='+encodeURIComponent(msg),'_blank');
    return;
  }

  var btn = event && event.target ? event.target.closest('button') : null;
  if(btn){ btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> جارٍ الإرسال...'; }

  html2canvas(card,{scale:1.5,useCORS:true,backgroundColor:'#0f172a'}).then(function(canvas){
    if(btn){ btn.disabled=false; btn.innerHTML='<i class="fab fa-whatsapp"></i> إرسال البطاقة لولي الأمر'; }
    canvas.toBlob(function(blob){
      var file = new File([blob],'بطاقة-'+p.name+'.png',{type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file], text:msg}).catch(function(){
          window.open('https://api.whatsapp.com/send?phone='+p.phone+'&text='+encodeURIComponent(msg),'_blank');
        });
      } else {
        window.open('https://api.whatsapp.com/send?phone='+p.phone+'&text='+encodeURIComponent(msg),'_blank');
      }
    },'image/png');
  }).catch(function(){
    if(btn){ btn.disabled=false; btn.innerHTML='<i class="fab fa-whatsapp"></i> إرسال البطاقة لولي الأمر'; }
    window.open('https://api.whatsapp.com/send?phone='+p.phone+'&text='+encodeURIComponent(msg),'_blank');
  });
}

function shareKaasCards(){

}
function printKaasCards(){
  var players = window._kaasPlayers||[];
  if(!players.length){alert('لا يوجد لاعبون');return;}
  var html='<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8">'+
    '<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">'+
    '<style>body{margin:0;padding:16px;background:#f1f5f9;font-family:Cairo,sans-serif;}'+
    '.card{break-inside:avoid;margin-bottom:16px;}'+
    '@media print{body{padding:0;}}</style></head><body>';
  players.forEach(function(p,i){html+='<div class="card">'+buildKaasCardHTML(p,i+1)+'</div>';});
  html+='<script>window.onload=function(){window.print();}<\/script></body></html>';
  var w=window.open('','_blank');w.document.write(html);w.document.close();
}
function captureKaasCards(players,mode,filename){
  var wrap=document.createElement('div');
  wrap.style.cssText='position:fixed;left:-9999px;top:0;width:340px;background:#f1f5f9;padding:16px;display:flex;flex-direction:column;z-index:-1;';
  players.forEach(function(p,i){
    var div=document.createElement('div');
    div.innerHTML=buildKaasCardHTML(p,i+1);
    wrap.appendChild(div.firstChild);
  });
  document.body.appendChild(wrap);
  var ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center;';
  ov.innerHTML='<div style="background:#fff;border-radius:12px;padding:24px 32px;text-align:center;font-family:Cairo,sans-serif;"><div style="width:32px;height:32px;border:3px solid #e2e8f0;border-top-color:#b81d22;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px;"></div><div style="font-size:13px;font-weight:700;color:#0f172a;">جارٍ التحضير...</div></div>';
  document.body.appendChild(ov);
  setTimeout(function(){
    html2canvas(wrap,{useCORS:true,scale:2,backgroundColor:'#f1f5f9',logging:false}).then(function(canvas){
      ov.remove();
      document.body.removeChild(wrap);
      if(mode==='مشاركة'){
        canvas.toBlob(function(blob){
          var file=new File([blob],filename+'.png',{type:'image/png'});
          if(navigator.canShare&&navigator.canShare({files:[file]})){
            navigator.share({files:[file],title:CONFIG.TOURNAMENT_NAME,text:'بطاقات اللاعبين — '+CONFIG.TOURNAMENT_NAME});
          } else {
            var a=document.createElement('a');a.download=filename+'.png';a.href=URL.createObjectURL(blob);a.click();
            setTimeout(function(){window.open('https://api.whatsapp.com/send?text='+encodeURIComponent('بطاقات اللاعبين: '+CONFIG.TOURNAMENT_NAME),'_blank');},800);
          }
        },'image/png');
        return;
      }
      var a=document.createElement('a');a.download=filename+'.png';a.href=canvas.toDataURL('image/png');a.click();
    }).catch(function(){ov.remove();document.body.removeChild(wrap);alert('حدث خطأ، جرب الطباعة');});
  },600);
}

  var players = (window._adminAllPlayers||[]).filter(function(p){
    var matchCat  = !catFilter || p.cat_id === catFilter;
    var matchText = !search ||
      (p.name||'').toLowerCase().includes(search) ||
      (p.academy_name||'').toLowerCase().includes(search);

  });

  var catColors = {cat1:'#1b5e2e',cat2:'#b81d22',cat3:'#d4af37',cat4:'#0e7490',cat5:'#7c3aed'};

function _renderMatchResultInner(schedule, results){
    // خريطة النتائج المسجلة
    var doneMap={};
    results.forEach(function(r){
      var t1=(r['الفريق الأول']||'').trim(), t2=(r['الفريق الثاني']||'').trim(), cat=(r['الفئة']||'').trim();
      if(t1&&t2){ doneMap[t1+'|'+t2+'|'+cat]=r['النتيجة']||'✓'; doneMap[t2+'|'+t1+'|'+cat]=r['النتيجة']||'✓'; }
    });
    var selCat = window._mrSelCat||'';
    var catTabs =
      '<button onclick="window._mrSelCat=\'\';renderMatchResult();" style="padding:6px 12px;border-radius:20px;border:none;font-family:Cairo,sans-serif;font-size:11px;font-weight:800;cursor:pointer;margin:2px;background:'+(selCat===''?'#1d4ed8':'#f1f5f9')+';color:'+(selCat===''?'#fff':'#475569')+';">الكل</button>'+
      CATEGORIES.map(function(c){
        return '<button onclick="window._mrSelCat=\''+c.id+'\';renderMatchResult();" style="padding:6px 12px;border-radius:20px;border:none;font-family:Cairo,sans-serif;font-size:11px;font-weight:800;cursor:pointer;margin:2px;background:'+(selCat===c.id?c.color:'#f1f5f9')+';color:'+(selCat===c.id?'#fff':'#475569')+';">'+c.name+'</button>';
      }).join('');

    var filtered = schedule.filter(function(m){
      var t1=(m['الفريق الأول']||'').trim(), t2=(m['الفريق الثاني']||'').trim();
      if(!t1||!t2) return false;
      if(selCat && (m['الفئة']||'').trim()!==selCat) return false;
      return true;
    });

    // تخزين المباريات في مصفوفة عامة للوصول بالرقم
    window._scheduleList = filtered;

    var pendingHtml='', doneHtml='', pendingCount=0, doneCount=0;
    filtered.forEach(function(m,idx){
      var t1=(m['الفريق الأول']||'').trim(), t2=(m['الفريق الثاني']||'').trim();
      var cat=(m['الفئة']||'').trim(), grp=(m['المجموعة']||'').trim();
      var date=fmtDate(m['التاريخ']), time=fmtTime(m['الوقت']), venue=(m['الملعب']||'').trim();
      var ci=CATEGORIES.find(function(c){return c.id===cat;})||{color:'#0d3318',name:''};
      var isDone=!!(doneMap[t1+'|'+t2+'|'+cat]);
      var result=doneMap[t1+'|'+t2+'|'+cat]||'';
      var card=
        '<div onclick="'+(isDone?'':'selectMatchByIdx('+idx+')')+'" '+
        'style="background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.07);border-right:4px solid '+ci.color+';'+(isDone?'opacity:.5;':'cursor:pointer;active-scale:.97;')+'">'+
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">'+

function saveMatchResult(){
  var d = window._mrData||{};
  var team1   = d.team1||'';
  var team2   = d.team2||'';
  var score1  = document.getElementById('mrScore1').value||'0';
  var score2  = document.getElementById('mrScore2').value||'0';
  var date    = d.date||'';
  var time    = d.time||'';
  var venue   = d.venue||'';
  var catId   = d.cat||'';
  var group   = d.grp||'';
  var status  = document.getElementById('mrStatus').value||'منتهية';
  var referee = (document.getElementById('mrReferee').value||'').trim();

  if(!team1||!team2){alert('لم يتم اختيار مباراة');return;}

  // جمع الأهداف
  var goals=[];
  document.querySelectorAll('.goal-row-new').forEach(function(r){
    var scorer=(r.querySelector('.goal-scorer-name').value||'').trim();
    var team=r.querySelector('.goal-team-sel').value;
    var min=r.querySelector('.goal-min-new').value||'';
    var type=r.querySelector('.goal-type-sel').value;
    if(scorer) goals.push({scorer:scorer,team:team,minute:min,type:type});
  });
  // جمع البطاقات
  var cards=[];
  document.querySelectorAll('.card-row').forEach(function(r){
    var player=(r.querySelector('.card-player-name').value||'').trim();
    var team=r.querySelector('.card-team-sel').value;
    var min=r.querySelector('.card-min').value||'';
    var type=r.querySelector('.card-type-sel').value;
    if(player) cards.push({player:player,team:team,minute:min,type:type});
  });
  // أفضل لاعب
  var mom=(document.getElementById('mrMOM').value||'').trim();
  var momTeam=(document.getElementById('mrMOMTeam')?document.getElementById('mrMOMTeam').value:'');

  var row = {
    'رقم المباراة': 'M'+Date.now().toString().slice(-8),
    'الفريق الأول':team1, 'الفريق الثاني':team2,
    'أهداف الأول':score1, 'أهداف الثاني':score2,
    'النتيجة': score1+' - '+score2,
    'الفائز': parseInt(score1)>parseInt(score2)?team1:(parseInt(score2)>parseInt(score1)?team2:'تعادل'),
    'التاريخ':date, 'الوقت':time, 'الملعب':venue, 'الفئة':catId,
    'المجموعة': group,
    'المرحلة': 'دور المجموعات',
    'الحالة':status, 'الحكم':referee, 'ملاحظات':'',
    'الأهداف': JSON.stringify(goals),
    'البطاقات': JSON.stringify(cards),
    'أفضل لاعب': mom, 'فريق أفضل لاعب': momTeam,
    'التبديلات': '[]',
    'وقت الحفظ': new Date().toLocaleDateString('ar')
  };

  var btn=document.querySelector('[onclick="saveMatchResult()"]');
  btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> جارٍ الحفظ...';

  apiAppend('نتائج المباريات', row).then(function(){
    btn.disabled=false; btn.innerHTML='<i class="fas fa-check"></i> تم الحفظ!';
    btn.style.background='linear-gradient(135deg,#16a34a,#14532d)';
    // نافذة المشاركة
    var overlay=document.createElement('div');
    overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
    overlay.innerHTML=
      '<div style="background:#fff;border-radius:20px;padding:24px;width:100%;max-width:340px;text-align:center;font-family:Cairo,sans-serif;">'+
        '<div style="font-size:40px;margin-bottom:8px;">✅</div>'+
        '<div style="font-size:16px;font-weight:900;color:#0d3318;margin-bottom:4px;">تم حفظ النتيجة بنجاح!</div>'+
        '<div style="font-size:22px;font-weight:900;color:#16a34a;margin:12px 0;padding:10px;background:#f0fdf4;border-radius:12px;">'+
          team1+' &nbsp;'+score1+' - '+score2+'&nbsp; '+team2+
        '</div>'+
        '<div style="display:flex;flex-direction:column;gap:10px;margin-top:16px;">'+
          '<button onclick="shareMatchResult(\''+team1+'\',\''+team2+'\',\''+score1+' - '+score2+'\',\''+date+'\',\''+time+'\',\''+venue+'\',\''+catId+'\')" '+
            'style="background:linear-gradient(135deg,#25d366,#128c7e);border:none;color:#fff;border-radius:12px;padding:12px;font-size:13px;font-weight:800;cursor:pointer;font-family:Cairo,sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;">'+
            '<i class="fab fa-whatsapp" style="font-size:18px;"></i> شارك النتيجة على واتساب'+
          '</button>'+
          '<button onclick="this.closest(\'div[style*=fixed]\').remove();invalidateCache(\'نتائج المباريات\');window._gsSelCat=\''+catId+'\';renderGroupStandings();" '+
            'style="background:linear-gradient(135deg,#0d3318,#1b5e2e);border:none;color:#fff;border-radius:12px;padding:12px;font-size:13px;font-weight:800;cursor:pointer;font-family:Cairo,sans-serif;">'+
            '🏆 عرض ترتيب المجموعات'+
          '</button>'+
          '<button onclick="this.closest(\'div[style*=fixed]\').remove();invalidateCache(\'نتائج المباريات\');renderMatchResult();" '+
            'style="background:#1d4ed8;border:none;color:#fff;border-radius:12px;padding:12px;font-size:13px;font-weight:800;cursor:pointer;font-family:Cairo,sans-serif;">'+
            '⚽ تسجيل مباراة أخرى'+
          '</button>'+
          '<button onclick="this.closest(\'div[style*=fixed]\').remove();go(\'admin_panel\')" '+
            'style="background:#f1f5f9;border:none;color:#475569;border-radius:12px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:Cairo,sans-serif;">'+
            'العودة للإدارة'+
          '</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(overlay);
  });

        '<div style="background:#fff;border-radius:16px;margin-bottom:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.07);">'+
          '<div style="background:'+cat.color+';padding:10px 14px;color:#fff;font-size:13px;font-weight:900;">'+cat.name+'</div>'+
          '<div style="padding:14px;">';

      awards.forEach(function(a){
        var k=cat.id+'|'+a.key;
        var cur=saved[k]||{};
        html+=
          '<div style="margin-bottom:14px;">'+
            '<div style="font-size:11px;font-weight:900;color:'+a.color+';margin-bottom:6px;">'+a.icon+' '+a.key+'</div>'+
            '<input id="aw_name_'+cat.id+'_'+a.key.replace(/ /g,'_')+'" placeholder="الاسم الكامل" value="'+(cur['الاسم']||'')+'" style="width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:8px;padding:8px 12px;font-size:13px;font-family:Cairo,sans-serif;margin-bottom:6px;">'+
            '<input id="aw_acad_'+cat.id+'_'+a.key.replace(/ /g,'_')+'" placeholder="الأكاديمية" value="'+(cur['الأكاديمية']||'')+'" style="width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:8px;padding:8px 12px;font-size:13px;font-family:Cairo,sans-serif;">'+
          '</div>';
      });

      html+=
          '<button onclick="saveAwards(\''+cat.id+'\')" style="width:100%;background:linear-gradient(135deg,#d4af37,#92700a);color:#fff;border:none;border-radius:10px;padding:10px;font-size:13px;font-weight:900;cursor:pointer;font-family:Cairo,sans-serif;">💾 حفظ '+cat.name+'</button>'+
        '</div>'+
      '</div>';
    });

    html+='</div>';
    document.getElementById('app').innerHTML=html;
  });
}

function saveAwards(catId){
  var awards=[
    {key:'أفضل مدرب',   keyId:'أفضل_مدرب'},
    {key:'أفضل إداري',  keyId:'أفضل_إداري'},
    {key:'أفضل لاعب',   keyId:'أفضل_لاعب'},
  ];
  var saved=0;
  awards.forEach(function(a){
    var name=(document.getElementById('aw_name_'+catId+'_'+a.keyId)||{}).value||'';
    var acad=(document.getElementById('aw_acad_'+catId+'_'+a.keyId)||{}).value||'';
    if(!name.trim()) return;
    apiAppend('جوائز البطولة',{
      'الفئة':catId, 'الجائزة':a.key,
      'الاسم':name.trim(), 'الأكاديمية':acad.trim(),
      'وقت الحفظ':new Date().toISOString()
    });
    saved++;
  });
  invalidateCache('جوائز البطولة');
  var cat=CATEGORIES.find(function(c){return c.id===catId;})||{name:catId};
  alert('✅ تم حفظ جوائز '+cat.name);
}

// التقارير اليومية والنهائية

function renderAdminReports(){
  if(!sessionStorage.getItem('kaasAdmin')){go('admin_login');return;}
  showL();

  Promise.all([
    apiGet('نتائج المباريات').catch(function(){return[];}),
    apiGet('الأكاديميات').catch(function(){return[];}),
    apiGet('اللاعبون').catch(function(){return[];}),
    apiGet('جوائز البطولة').catch(function(){return[];})
  ]).then(function(res){
    var results  = Array.isArray(res[0]) ? res[0] : [];
    var acadList = Array.isArray(res[1]) ? res[1] : [];
    var players  = Array.isArray(res[2]) ? res[2] : [];
    var awards   = Array.isArray(res[3]) ? res[3] : [];

    // تجميع التواريخ المتاحة من المباريات المنتهية
    var datesSet = {};
    results.forEach(function(r){
      var d = (r['التاريخ']||'').trim();
      var score = (r['النتيجة']||'').trim();
      if(d && score && score.indexOf('-') > -1) datesSet[d] = true;
    });
    var dates = Object.keys(datesSet).sort();

    // اليوم المختار
    var selDate = window._reportSelDate || (dates.length ? dates[dates.length-1] : '');

    // ─── بناء تقرير يوم ─────────────────────────
    function buildDailyReport(date){
      var dayResults = results.filter(function(r){
        return (r['التاريخ']||'').trim() === date && (r['النتيجة']||'').indexOf('-') > -1;
      });

      if(!dayResults.length) return '<div style="text-align:center;padding:24px;color:#94a3b8;font-size:13px;">لا توجد مباريات منتهية في هذا اليوم</div>';

      var totalGoals=0, totalYellow=0, totalRed=0, momList=[];
      var scorerMap = {};

      dayResults.forEach(function(r){
        var m = (r['النتيجة']||'').match(/(\d+)\s*[-–]\s*(\d+)/);
        if(m){ totalGoals += parseInt(m[1]) + parseInt(m[2]); }
        try{
          var cards = JSON.parse(r['البطاقات']||'[]');
          cards.forEach(function(c){
            if((c.type||'') === 'صفراء') totalYellow++;
            else if((c.type||'') === 'حمراء') totalRed++;
          });
        }catch(e){}
        try{
          var goals = JSON.parse(r['الأهداف']||'[]');
          goals.forEach(function(g){
            if(!g.player || (g.type||'')==='مرمى ذاتي') return;
            var k = g.player.trim();
            if(!scorerMap[k]) scorerMap[k]={name:k, team:g.team||'', goals:0};
            scorerMap[k].goals++;
          });
        }catch(e){}
        if(r['أفضل لاعب'] && r['أفضل لاعب'].trim()) momList.push({name:r['أفضل لاعب'].trim(), match:(r['الفريق الأول']||'') + ' vs ' + (r['الفريق الثاني']||'')});
      });

      var topScorers = Object.values(scorerMap).sort(function(a,b){return b.goals-a.goals;}).slice(0,5);

      // حفظ البيانات للمشاركة
      window._reportData = {
        date: date,
        matchCount: dayResults.length,
        totalGoals: totalGoals,
        totalYellow: totalYellow,
        totalRed: totalRed,
        matches: dayResults.map(function(r){
          var cat = CATEGORIES.find(function(c){return c.id===(r['الفئة']||'');});
          return {team1:r['الفريق الأول']||'', result:r['النتيجة']||'', team2:r['الفريق الثاني']||'', venue:r['الملعب']||'', catName:cat?cat.name:''};
        }),
        topScorers: topScorers,
        momList: momList
      };

      var matchRows = dayResults.map(function(r){
        var cat = CATEGORIES.find(function(c){return c.id===(r['الفئة']||'');});
        return '<tr style="border-bottom:1px solid #f1f5f9;">'+
          '<td style="padding:8px 10px;font-weight:800;font-size:12px;">'+
            (cat?'<span style="background:'+cat.color+'22;color:'+cat.color+';padding:2px 6px;border-radius:6px;font-size:10px;font-weight:900;margin-left:4px;">'+cat.name+'</span>':'')+
            (r['الفريق الأول']||'-')+
          '</td>'+
          '<td style="padding:8px 6px;text-align:center;font-weight:900;font-size:15px;color:#0d3318;">'+r['النتيجة']+'</td>'+
          '<td style="padding:8px 10px;font-weight:800;font-size:12px;">'+r['الفريق الثاني']+'</td>'+
          (r['الملعب']?'<td style="padding:8px 6px;font-size:10px;color:#94a3b8;">'+r['الملعب']+'</td>':'<td></td>')+
        '</tr>';
      }).join('');

      var html =
        '<div style="background:#0d3318;color:#fff;padding:12px 14px;border-radius:10px 10px 0 0;display:flex;justify-content:space-between;align-items:center;">'+
          '<div style="font-size:13px;font-weight:900;">📅 '+date+'</div>'+
          '<div style="font-size:11px;opacity:.7;">'+dayResults.length+' مباريات</div>'+
        '</div>'+
        // إحصائيات سريعة
        '<div style="display:grid;grid-template-columns:repeat(4,1fr);background:#f8fafc;border:1px solid #e2e8f0;border-top:none;">'+
          '<div style="text-align:center;padding:10px 4px;border-left:1px solid #e2e8f0;"><div style="font-size:18px;font-weight:900;color:#0d3318;">'+dayResults.length+'</div><div style="font-size:9px;color:#94a3b8;">مباراة</div></div>'+
          '<div style="text-align:center;padding:10px 4px;border-left:1px solid #e2e8f0;"><div style="font-size:18px;font-weight:900;color:#b81d22;">'+totalGoals+'</div><div style="font-size:9px;color:#94a3b8;">هدف</div></div>'+
          '<div style="text-align:center;padding:10px 4px;border-left:1px solid #e2e8f0;"><div style="font-size:18px;font-weight:900;color:#d97706;">'+totalYellow+'</div><div style="font-size:9px;color:#94a3b8;">صفراء</div></div>'+
          '<div style="text-align:center;padding:10px 4px;"><div style="font-size:18px;font-weight:900;color:#dc2626;">'+totalRed+'</div><div style="font-size:9px;color:#94a3b8;">حمراء</div></div>'+
        '</div>'+
        // جدول المباريات
        '<div style="overflow-x:auto;border:1px solid #e2e8f0;border-top:none;border-radius:0 0 10px 10px;">'+
          '<table style="width:100%;border-collapse:collapse;font-family:Cairo,sans-serif;">'+
            '<thead><tr style="background:#f1f5f9;"><th style="padding:8px 10px;font-size:10px;font-weight:900;color:#475569;text-align:right;">الفريق الأول</th><th style="padding:8px 6px;font-size:10px;font-weight:900;color:#475569;text-align:center;">النتيجة</th><th style="padding:8px 10px;font-size:10px;font-weight:900;color:#475569;text-align:right;">الفريق الثاني</th><th style="padding:8px 6px;font-size:10px;font-weight:900;color:#475569;text-align:right;">الملعب</th></tr></thead>'+
            '<tbody>'+matchRows+'</tbody>'+
          '</table>'+
        '</div>';

      if(topScorers.length){
        html += '<div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;margin-top:10px;overflow:hidden;">'+
          '<div style="background:#b45309;color:#fff;padding:8px 12px;font-size:11px;font-weight:900;">⚽ هدافو اليوم</div>';

        html += '<div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;margin-top:10px;overflow:hidden;">'+
          '<div style="background:#d4af37;color:#fff;padding:8px 12px;font-size:11px;font-weight:900;">🌟 أفضل لاعبي اليوم</div>';
        momList.forEach(function(m){
          html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid #f8fafc;">'+
            '<div style="font-weight:800;font-size:12px;">'+m.name+'</div>'+
            '<div style="font-size:10px;color:#64748b;">'+m.match+'</div>'+
          '</div>';
        });
        html += '</div>';
      }

      return html;
    }

    // ─── تقرير نهائي ────────────────────────────
    function buildFinalReport(){
      var finishedResults = results.filter(function(r){ return (r['النتيجة']||'').indexOf('-') > -1; });
      var totalGoals=0, totalYellow=0, totalRed=0, totalMOM=0;
      var scorerMap = {};

      finishedResults.forEach(function(r){
        var m = (r['النتيجة']||'').match(/(\d+)\s*[-–]\s*(\d+)/);
        if(m){ totalGoals += parseInt(m[1]) + parseInt(m[2]); }
        try{
          var cards = JSON.parse(r['البطاقات']||'[]');
          cards.forEach(function(c){
            if((c.type||'') === 'صفراء') totalYellow++;
            else if((c.type||'') === 'حمراء') totalRed++;
          });
        }catch(e){}
        try{
          var goals = JSON.parse(r['الأهداف']||'[]');
          goals.forEach(function(g){
            if(!g.player || (g.type||'')==='مرمى ذاتي') return;
            var k = g.player.trim();
            if(!scorerMap[k]) scorerMap[k]={name:k, team:g.team||'', goals:0};
            scorerMap[k].goals++;
          });
        }catch(e){}
        if(r['أفضل لاعب'] && r['أفضل لاعب'].trim()) totalMOM++;

      var awardsMap = {};

      var html =

      '</div>'+
      '<div style="display:flex;gap:8px;padding:12px 16px;background:#0d3c66;">'+
        '<button onclick="window._reportType=\'daily\';window._reportData=null;renderAdminReports();" style="flex:1;padding:10px;border:none;border-radius:10px;font-family:Cairo,sans-serif;font-size:12px;font-weight:900;cursor:pointer;background:'+(reportType==='daily'?'#fff':'rgba(255,255,255,.15)')+';color:'+(reportType==='daily'?'#0f4c75':'#fff')+';">📅 تقرير يومي</button>'+

// مشاركة التقرير نصياً عبر واتساب
function shareReportWA(type) {
  // جمع البيانات من window._reportData الذي نحفظه عند بناء التقرير
  var d = window._reportData;
  if(!d) { alert('الرجاء فتح التقرير أولاً'); return; }

  var lines = [];
  var sep = '━━━━━━━━━━━━━━━━━━━━━━';

  if(type === 'daily') {
    lines.push('📅 *تقرير يوم ' + d.date + '*');
    lines.push('🏆 ' + CONFIG.TOURNAMENT_NAME);
    lines.push(sep);
    lines.push('📊 *الإحصائيات:*');
    lines.push('• المباريات: ' + d.matchCount);
    lines.push('• الأهداف: ' + d.totalGoals);
    lines.push('• بطاقات صفراء: ' + d.totalYellow);
    lines.push('• بطاقات حمراء: ' + d.totalRed);
    lines.push(sep);
    lines.push('⚽ *نتائج المباريات:*');
    d.matches.forEach(function(m) {
      var catLabel = m.catName ? '[' + m.catName + '] ' : '';
      lines.push(catLabel + m.team1 + '  ' + m.result + '  ' + m.team2);
      if(m.venue) lines.push('   📍 ' + m.venue);
    });
    if(d.topScorers && d.topScorers.length) {
      lines.push(sep);
      lines.push('⚽ *هدافو اليوم:*');
      d.topScorers.forEach(function(s, i) {
        lines.push((i+1) + '. ' + s.name + ' (' + s.team + ') — ' + s.goals + ' هدف');
      });
    }
    if(d.momList && d.momList.length) {
      lines.push(sep);
      lines.push('🌟 *أفضل لاعبي اليوم:*');
      d.momList.forEach(function(m) {
        lines.push('• ' + m.name + ' — ' + m.match);
      });
    }
  } else {
    lines.push('🏆 *التقرير الختامي*');
    lines.push(CONFIG.TOURNAMENT_NAME + ' · ' + CONFIG.SEASON);
    lines.push(CONFIG.LOCATION + ' · ' + CONFIG.EVENT_DATE_DISPLAY);
    lines.push(sep);
    lines.push('📊 *إحصائيات البطولة:*');
    lines.push('• الأكاديميات: ' + d.acadCount);
    lines.push('• اللاعبون: ' + d.playerCount);
    lines.push('• المباريات: ' + d.matchCount);
    lines.push('• الأهداف: ' + d.totalGoals);
    lines.push('• بطاقات صفراء: ' + d.totalYellow);
    lines.push('• بطاقات حمراء: ' + d.totalRed);
    if(d.topScorers && d.topScorers.length) {
      lines.push(sep);
      lines.push('⚽ *هدافو البطولة:*');
      var medals = ['🥇','🥈','🥉'];
      d.topScorers.forEach(function(s, i) {
        lines.push((medals[i]||((i+1)+'.')) + ' ' + s.name + ' (' + s.team + ') — ' + s.goals + ' هدف');
      });
    }
    if(d.awards && d.awards.length) {
      lines.push(sep);
      lines.push('🏅 *الجوائز:*');
      d.awards.forEach(function(a) {
        lines.push('• [' + a.catName + '] ' + a.key + ': *' + a.name + '* — ' + a.acad);
      });
    }
  }

  lines.push(sep);
  lines.push('🔗 acadcup.com');

  var text = lines.join('\n');
  window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(text), '_blank');
}

function showAddMediaPanel(){
  var f = document.getElementById('addMediaFormPanel');

function setMediaTypePanel(t){
  window._mediaPanelType = t;
  ['Photo','Video','Album'].forEach(function(n){
    var btn = document.getElementById('mpBtn'+n);
    if(!btn) return;
    var active = t===n.toLowerCase();
    btn.style.background = active?'#6d28d9':'#fff';
    btn.style.color      = active?'#fff':'#475569';
    btn.style.border     = '2px solid '+(active?'#6d28d9':'#e2e8f0');
  });
  var urlEl = document.getElementById('mpUrl');
  var extras = document.getElementById('mpAlbumExtras');
  if(urlEl) urlEl.placeholder =
    t==='photo' ? 'رابط الصورة (Google Drive أو Imgur)' :
    t==='video' ? 'رابط يوتيوب (https://youtu.be/xxxxx)' :
                  'رابط ألبوم Google Photos';
  if(extras) extras.style.display = t==='album'?'block':'none';
}

function submitMediaPanel(){
  var title = (document.getElementById('mpTitle')||{}).value||'';
  var url   = (document.getElementById('mpUrl')||{}).value||'';
  var date  = (document.getElementById('mpDate')||{}).value||'';
  var count = (document.getElementById('mpCount')||{}).value||'';
  var type  = window._mediaPanelType||'photo';

  if(!url.trim()){ alert('الرجاء إدخال الرابط'); return; }

  if(type==='photo' && url.indexOf('drive.google.com')>-1){
    var m = url.match(/\/d\/([^/]+)/);
    if(m) url = 'https://drive.google.com/uc?export=view&id='+m[1];
  }
  if(type==='video'){
    var vid = extractYtId(url);
    if(vid) url = 'https://www.youtube.com/watch?v='+vid;
  }

  apiAppend('المعرض',{
    'النوع': type,
    'العنوان': title.trim()||'بدون عنوان',
    'الرابط': url.trim(),
    'العدد': count||'',
    'التاريخ': date,
    'وقت الإضافة': new Date().toISOString()
  });
  invalidateCache('المعرض');

  document.getElementById('addMediaFormPanel').style.display='none';

window._mediaType = 'photo';

function showAddMedia(){
  var f = document.getElementById('addMediaForm');
  if(f) f.style.display = f.style.display==='none' ? 'block' : 'none';
}

function setMediaType(t){
  window._mediaType = t;
  ['Photo','Video','Album'].forEach(function(n){
    var btn = document.getElementById('typeBtn'+n);
    if(!btn) return;
    var active = t===n.toLowerCase();
    btn.style.background = active?'#6d28d9':'#fff';
    btn.style.color      = active?'#fff':'#475569';
    btn.style.border     = '2px solid '+(active?'#6d28d9':'#e2e8f0');
  });
  var url = document.getElementById('mediaUrl');
  var extras = document.getElementById('albumExtras');
  if(url) url.placeholder =
    t==='photo' ? 'رابط الصورة (Google Drive أو Imgur)' :
    t==='video' ? 'رابط يوتيوب (مثال: https://youtu.be/xxxxx)' :
                  'رابط ألبوم Google Photos (https://photos.app.goo.gl/...)';
  if(extras) extras.style.display = t==='album'?'block':'none';
}

function submitMedia(){
  var title = (document.getElementById('mediaTitle')||{}).value||'';
  var url   = (document.getElementById('mediaUrl')||{}).value||'';
  var date  = (document.getElementById('mediaDate')||{}).value||'';
  var count = (document.getElementById('mediaCount')||{}).value||'';
  var type  = window._mediaType||'photo';

  if(!url.trim()){ alert('الرجاء إدخال الرابط'); return; }

  // تحويل رابط Google Drive إلى رابط مباشر
  if(type==='photo' && url.indexOf('drive.google.com')>-1){
    var m = url.match(/\/d\/([^/]+)/);
    if(m) url = 'https://drive.google.com/uc?export=view&id='+m[1];
  }
  // تطبيع رابط يوتيوب
  if(type==='video'){
    var vid = extractYtId(url);
    if(vid) url = 'https://www.youtube.com/watch?v='+vid;
  }

  apiAppend('المعرض',{
    'النوع': type,
    'العنوان': title.trim()||'بدون عنوان',
    'الرابط': url.trim(),
    'العدد': count||'',
    'التاريخ': date,
    'وقت الإضافة': new Date().toISOString()
  });
  invalidateCache('المعرض');

  // إغلاق النموذج وتحديث الصفحة
  document.getElementById('addMediaForm').style.display='none';
  document.getElementById('mediaTitle').value='';
  document.getElementById('mediaUrl').value='';
  var mc=document.getElementById('mediaCount'); if(mc) mc.value='';
  setTimeout(function(){ renderAdminGallery(); }, 1200);
}

function deleteGalleryByIdx(idx){
  var items = window._mediaPanelItems||[];
  var it = items[idx];
  if(!it) return;
  var title = it['العنوان']||'هذا العنصر';
  var url   = it['الرابط']||'';
  if(!confirm('حذف "'+title+'" من المعرض؟')) return;

  // احذف الكرت من DOM فوراً
  var card = document.querySelector('[data-didx="'+idx+'"]');
  if(card) card.parentElement.removeChild(card);

  // احذف من المصفوفة
  items.splice(idx, 1);
  window._mediaPanelItems = items;
  invalidateCache('المعرض');

  // أرسل للـGAS عبر GET
  var delUrl = CONFIG.GAS_URL
    + '?action=deleteGalleryItem'
    + '&item_url='   + encodeURIComponent(url)
    + '&item_title=' + encodeURIComponent(title);
  fetch(delUrl).catch(function(){});
}

function deleteGalleryItem(id, title, url){}

function extractYtId(url){
  var m = url.match(/(?:youtu\.be\/|v=|\/embed\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}

function getYtThumb(url){
  var id = extractYtId(url);
  return id ? 'https://img.youtube.com/vi/'+id+'/mqdefault.jpg' : '';
}

}

function deleteGalleryCard(btn){

}

function openMediaModal(type, url, title, date){
  var modal   = document.getElementById('mediaModal');
  var content = document.getElementById('mediaModalContent');
  var titleEl = document.getElementById('mediaModalTitle');
  var dateEl  = document.getElementById('mediaModalDate');
  if(!modal||!content) return;

  if(type==='video'){
    var vid = extractYtId(url);
    content.innerHTML = vid
      ? '<div style="position:relative;width:100%;padding-bottom:56.25%;"><iframe src="https://www.youtube.com/embed/'+vid+'?autoplay=1" style="position:absolute;inset:0;width:100%;height:100%;border:none;border-radius:10px;" allowfullscreen allow="autoplay"></iframe></div>'
      : '<div style="color:#fff;text-align:center;padding:20px;">تعذّر تحميل الفيديو</div>';
  } else {
    var isDrive = url.indexOf('drive.google.com')>-1 || url.indexOf('docs.google.com')>-1;
    if(isDrive){
      content.innerHTML =
        '<div style="text-align:center;padding:30px 20px;">'+
          '<div style="font-size:48px;margin-bottom:12px;">🖼️</div>'+
          '<div style="color:#fff;font-size:14px;font-weight:700;margin-bottom:6px;">'+(title||'الصورة')+'</div>'+
          '<div style="color:rgba(255,255,255,.5);font-size:12px;margin-bottom:20px;">صورة Google Drive</div>'+
          '<a href="'+url+'" target="_blank" style="display:inline-block;background:#4c1d95;color:#fff;padding:12px 24px;border-radius:10px;text-decoration:none;font-size:14px;font-weight:800;">🔗 فتح الصورة</a>'+
        '</div>';
    } else {
      content.innerHTML =
        '<div id="imgWrapper" style="text-align:center;">'+
          '<img src="'+url+'" style="width:100%;border-radius:10px;max-height:65vh;object-fit:contain;" '+
            'onerror="document.getElementById(\'imgWrapper\').innerHTML=\'<div style=\\\'text-align:center;padding:20px\\\'><div style=\\\'font-size:40px;margin-bottom:10px\\\'>🖼️</div><div style=\\\'color:#fff;font-size:13px;margin-bottom:16px\\\'>تعذّر تحميل الصورة</div><a href=\\\"'+url+'\\\" target=\\\"_blank\\\" style=\\\'background:#4c1d95;color:#fff;padding:10px 20px;border-radius:8px;text-decoration:none;font-size:13px\\\'>فتح في تاب جديد</a></div>\'">'+
        '</div>';
    }
  }
  if(titleEl) titleEl.textContent = title||'';
  if(dateEl)  dateEl.textContent  = date||'';
  modal.style.display = 'flex';
}

function closeMediaModal(e){
  if(e && e.target && e.target.id!=='mediaModal') return;
  var modal = document.getElementById('mediaModal');
  if(modal){
    modal.style.display='none';
    var c=document.getElementById('mediaModalContent');
    if(c) c.innerHTML=''; // إيقاف الفيديو
  }
}

function filterBpPlayers(){
  var cat=(document.getElementById('bpCat')||{}).value||'';
  var acad=(document.getElementById('bpAcad')||{}).value||'';
  var search=((document.getElementById('bpSearch')||{}).value||'').toLowerCase();
  var players=(window._bpPlayers||[]).filter(function(p){
    return (!cat||p.cat_id===cat)&&(!acad||p.academy_name===acad)&&
           (!search||(p.name||'').toLowerCase().includes(search));
  });
  var html=players.map(function(p){
    var cat=CATEGORIES.find(function(c){return c.id===p.cat_id;})||{};
    var photo=getPlayerPhoto(p.id||'');
    return '<div onclick="selectBpPlayer(\''+p.id+'\',\''+p.name.replace(/'/g,'')+'\',\''+p.academy_name+'\',\''+(cat.name||'')+'\')\" '+
      'style="display:flex;align-items:center;gap:10px;padding:10px;border:1.5px solid #e2e8f0;border-radius:10px;margin-bottom:6px;cursor:pointer;background:#fff;transition:border .15s;" '+
      'onmouseover="this.style.borderColor=\'#d4af37\'" onmouseout="this.style.borderColor=\'#e2e8f0\'">'+
      (photo?'<img src="'+photo+'" style="width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0;">':
        '<div style="width:38px;height:38px;border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;">👤</div>')+
      '<div style="flex:1;"><div style="font-weight:800;font-size:13px;">'+p.name+'</div>'+
      '<div style="font-size:10px;color:#64748b;">'+p.academy_name+' · '+(cat.label||'')+'</div></div>'+
      '<i class="fas fa-chevron-left" style="color:#cbd5e1;font-size:12px;"></i>'+
      '</div>';
  }).join('');
  var el=document.getElementById('bpPlayersList');
  if(el) el.innerHTML=html||(players.length?'':'<div style="text-align:center;padding:20px;color:#94a3b8;font-size:12px;">لا توجد نتائج</div>');
}

function selectBpPlayer(id,name,acad,cat){
  window._bpChosen={id:id,name:name,acad:acad,cat:cat};
  var info=document.getElementById('bpSelectedInfo');
  if(info) info.innerHTML='<div style="font-size:14px;font-weight:900;color:#1a1a2e;">'+name+'</div>'+
    '<div style="font-size:11px;color:#64748b;margin-top:3px;">'+acad+' · '+cat+'</div>';
  var box=document.getElementById('bpSelected');
  if(box){box.style.display='block';box.scrollIntoView({behavior:'smooth'});}
}

function saveBestPlayer(){
  var ch=window._bpChosen;
  if(!ch){alert('اختر لاعباً أولاً');return;}
  var title=(document.getElementById('bpTitle').value||'').trim();
  var match=(document.getElementById('bpMatch').value||'').trim();
  var row={
    player_id:ch.id, player_name:ch.name, academy_name:ch.acad,
    category:ch.cat, award_title:title, match_context:match,
    date:new Date().toLocaleDateString('ar'),
    awarded_by: sessionStorage.getItem('kaasAcadName')||'الإدارة'
  };
  var btn=document.querySelector('[onclick="saveBestPlayer()"]');
  btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> جارٍ النشر...';
  invalidateCache('أفضل لاعب');
  apiAppend('أفضل لاعب',row).then(function(){
    alert('✅ تم اختيار '+ch.name+' كـ"'+title+'" ونشره على المنصة!');
    go('admin_panel');

function saveRefereeReport(){
  var name=(document.getElementById('rfName').value||'').trim();
  var team1=(document.getElementById('rfTeam1').value||'').trim();
  var team2=(document.getElementById('rfTeam2').value||'').trim();
  if(!name){alert('أدخل اسم الحكم');return;}
  if(!team1||!team2){alert('أدخل اسمي الفريقين');return;}

  var row={
    report_id:'RF'+Date.now().toString().slice(-8),
    referee_name:name,
    assistant1:(document.getElementById('rfAs1').value||'').trim(),
    assistant2:(document.getElementById('rfAs2').value||'').trim(),
    fourth:(document.getElementById('rfFourth').value||'').trim(),
    team1:team1, team2:team2,
    score1:document.getElementById('rfScore1').value,
    score2:document.getElementById('rfScore2').value,
    date:document.getElementById('rfDate').value,
    venue:(document.getElementById('rfVenue').value||'').trim(),
    yellow1:document.getElementById('rfY1').value,
    yellow2:document.getElementById('rfY2').value,
    red1:document.getElementById('rfR1').value,
    red2:document.getElementById('rfR2').value,
    notes:(document.getElementById('rfNotes').value||'').trim(),
    rating:document.getElementById('rfRating').value,
    saved_at:new Date().toLocaleDateString('ar')
  };

  var btn=document.querySelector('[onclick="saveRefereeReport()"]');
  btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> جارٍ الحفظ...';
  invalidateCache('تقارير الحكام');
  apiAppend('تقارير الحكام',row).then(function(){
    alert('✅ تم حفظ تقرير الحكم بنجاح!');
    go('admin_panel');
  });
}

  apiGet('الأكاديميات').then(function(rows){
    var list=rows||[];
    window._allAcadsApproval=list;
    _renderApprovalList(list);
  });
}

function _renderApprovalList(list){
  var local=_getLocalStatuses();
  // دمج القرارات المحلية مع بيانات الشيت
  list=list.map(function(a){
    if(local[a.id]) a.status=local[a.id];
    return a;
  });
  var pending=list.filter(function(a){return !a.status||a.status==='قيد الاعتماد';});
  var approved=list.filter(function(a){return a.status==='معتمد';});
  var rejected=list.filter(function(a){return a.status==='مرفوض';});

  // تحديث badge الشريط الجانبي
  var badge=document.getElementById('sidebarPendingBadge');
  if(badge){if(pending.length>0){badge.textContent=pending.length;badge.style.display='';}else{badge.style.display='none';}}

  var html='';

  // طلبات قيد الاعتماد
  html+='<div style="font-size:12px;font-weight:900;color:#92400e;background:#fef9c3;border:1px solid #fde68a;border-radius:10px;padding:10px 14px;margin-bottom:12px;">'+
    '<i class="fas fa-clock"></i> قيد الاعتماد ('+pending.length+')</div>';
  if(pending.length===0){
    html+='<div style="text-align:center;padding:20px;color:#94a3b8;font-size:12px;">لا توجد طلبات جديدة</div>';
  } else {
    pending.forEach(function(a){html+=_acadCard(a,true);});
  }

  // الأكاديميات المعتمدة
  if(approved.length>0){
    html+='<div style="font-size:12px;font-weight:900;color:#166534;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:10px 14px;margin:16px 0 10px;">'+
      '<i class="fas fa-check-circle"></i> معتمدة ('+approved.length+')</div>';
    approved.forEach(function(a){html+=_acadCard(a,false);});
  }

  // الأكاديميات المرفوضة
  if(rejected.length>0){
    html+='<div style="font-size:12px;font-weight:900;color:#991b1b;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:10px 14px;margin:16px 0 10px;">'+
      '<i class="fas fa-times-circle"></i> مرفوضة ('+rejected.length+')</div>';
    rejected.forEach(function(a){html+=_acadCard(a,false);});
  }

  document.getElementById('acadApprovalList').innerHTML=html;
}

function _getLocalStatuses(){
  try{return JSON.parse(localStorage.getItem('kaasAcadStatuses')||'{}');}catch(e){return {};}
}
function _saveLocalStatus(id,status){
  var s=_getLocalStatuses(); s[id]=status;
  localStorage.setItem('kaasAcadStatuses',JSON.stringify(s));
}

  var card=document.getElementById('acadCard_'+id);

    card.innerHTML='<div style="text-align:center;padding:20px;">'+

function testGasConnection(){
  var out = document.createElement('div');
  out.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;';
  out.innerHTML='<div style="background:#fff;border-radius:16px;width:100%;max-width:420px;overflow:hidden;">'+
    '<div style="background:linear-gradient(135deg,#1b5e2e,#0d3318);padding:14px 18px;color:#fff;font-size:14px;font-weight:900;">🔌 اختبار الاتصال</div>'+
    '<div style="padding:16px;" id="gasTestBody"><div style="text-align:center;padding:20px;color:#64748b;">جاري الاختبار...</div></div>'+
    '<div style="padding:12px 16px;border-top:1px solid #e2e8f0;text-align:center;">'+
      '<button onclick="this.closest(\'div[style*=fixed]\').remove()" style="background:#f1f5f9;color:#475569;border:none;border-radius:8px;padding:9px 24px;font-size:13px;font-weight:700;cursor:pointer;font-family:Cairo,sans-serif;">إغلاق</button>'+
    '</div></div>';
  document.body.appendChild(out);
  var results=[];
  function show(){
    var body=document.getElementById('gasTestBody');
    if(!body) return;
    body.innerHTML=results.map(function(r){
      return '<div style="display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #f1f5f9;">'+
        '<div style="font-size:18px;flex-shrink:0;">'+(r.ok?'✅':'❌')+'</div>'+
        '<div><div style="font-size:13px;font-weight:700;color:'+(r.ok?'#16a34a':'#b81d22')+';">'+r.title+'</div>'+
        '<div style="font-size:11px;color:#64748b;margin-top:2px;">'+r.detail+'</div></div></div>';
    }).join('')+(results.length<2?'<div style="text-align:center;padding:8px;color:#64748b;font-size:12px;">جاري المزيد...</div>':'');
  }
  fetch(CONFIG.GAS_URL+'?sheet=الأكاديميات&nocache='+Date.now())
    .then(function(r){return r.json();})
    .then(function(d){results.push({ok:true,title:'قراءة البيانات ✓',detail:'اتصال Google Sheets يعمل — '+(Array.isArray(d)?d.length:0)+' أكاديمية'});show();})
    .catch(function(e){results.push({ok:false,title:'فشل الاتصال',detail:e.message});show();});
  setTimeout(function(){
    fetch(CONFIG.GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'append',sheet:'_test',data:[{test:'ping'}]})})
      .then(function(){results.push({ok:true,title:'إرسال البيانات ✓',detail:'الإرسال إلى GAS يعمل'});show();})
      .catch(function(e){results.push({ok:false,title:'فشل الإرسال',detail:e.message});show();});
  },1000);
}

function addMatchToSchedule(){
  var t1=(document.getElementById('am1').value||'').trim();
  var t2=(document.getElementById('am2').value||'').trim();
  var date=document.getElementById('amDate').value;
  var time=document.getElementById('amTime').value;
  var field=(document.getElementById('amField').value||'').trim();
  var cat=document.getElementById('amCat').value;
  if(!t1||!t2){alert('أدخل اسمي الفريقين');return;}
  if(!date){alert('اختر تاريخ المباراة');return;}
  var btn=event.target;
  btn.disabled=true;btn.textContent='جاري الحفظ...';
  apiAppend('جدول المباريات',{
    'الفريق الأول':t1,'الفريق الثاني':t2,
    'التاريخ':date,'الوقت':time,
    'الملعب':field,'الفئة':cat,'النتيجة':''
  }).then(function(){
    btn.disabled=false;btn.innerHTML='<i class="fas fa-save"></i> حفظ المباراة في الجدول';
    document.getElementById('am1').value='';
    document.getElementById('am2').value='';
    document.getElementById('amDate').value='';
    document.getElementById('amTime').value='';
    document.getElementById('amCat').value='';
    invalidateCache('جدول المباريات');
    alert('✅ تمت إضافة المباراة للجدول بنجاح!');
  }).catch(function(){
    btn.disabled=false;btn.innerHTML='<i class="fas fa-save"></i> حفظ المباراة في الجدول';
    alert('⚠️ تم الإرسال — قد يستغرق ظهوره دقيقة');
    invalidateCache('جدول المباريات');
  });
}

function filterMatchByAcad(){
  var acadName=(document.getElementById('mAcad').value||'').trim();
  var catId=document.getElementById('mCat').value||'';
  var players=(window._matchPlayers||[]).filter(function(p){
    var pAcad=p.academy_name||p['الأكاديمية']||'';
    var pCat=p.cat_id||p['الفئة']||'';
    return (!acadName||pAcad===acadName)&&(!catId||pCat===catId);
  });
  var listDiv=document.getElementById('matchPlayersList');
  var items=document.getElementById('matchPlayerItems');
  if(!acadName&&!catId){listDiv.style.display='none';items.innerHTML='';updateMatchCount();return;}
  listDiv.style.display='block';
  items.innerHTML=players.map(function(p){
    var name=p.name||p['اسم اللاعب']||'';
    var cat=CATEGORIES.find(function(c){return c.id===(p.cat_id||p['الفئة']);});
    return '<label style="display:flex;align-items:center;gap:10px;padding:10px;border:1.5px solid #e2e8f0;border-radius:8px;margin-bottom:6px;cursor:pointer;background:#fff;">'+
      '<input type="checkbox" class="match-chk" value="'+name+'" onchange="updateMatchCount()" style="width:18px;height:18px;cursor:pointer;">'+
      '<div><div style="font-weight:700;font-size:13px;">'+name+'</div>'+
      '<div style="font-size:10px;color:#64748b;">'+(p.birth||p['تاريخ الميلاد']||'')+(cat?' · '+cat.label:'')+'</div></div>'+
      '</label>';
  }).join('');
  updateMatchCount();
}

function selectAllMatch(val){
  document.querySelectorAll('.match-chk').forEach(function(c){c.checked=val;});
  updateMatchCount();
}

function updateMatchCount(){
  var n=document.querySelectorAll('.match-chk:checked').length;
  var el=document.getElementById('matchCount');
  if(!el) return;
  el.style.display=n?'block':'none';
  el.textContent='✅ تم اختيار '+n+' لاعب';
}

function sendMatchListWA(){
  var opponent=(document.getElementById('mOpponent').value||'').trim();
  var date=document.getElementById('mDate').value;
  var time=document.getElementById('mTime').value;
  var venue=(document.getElementById('mVenue').value||'').trim();
  var acad=(document.getElementById('mAcad').value||'').trim();
  var selected=[];
  document.querySelectorAll('.match-chk:checked').forEach(function(c){selected.push(c.value);});
  if(!opponent){alert('أدخل اسم الفريق المنافس');return;}
  if(!selected.length){alert('اختر لاعباً واحداً على الأقل');return;}
  var dateStr=date?new Date(date).toLocaleDateString('ar-SA'):'';
  var msg='🏆 *'+CONFIG.TOURNAMENT_NAME+'*\n';
  if(acad) msg+='🏫 *'+acad+'*\n';
  msg+='⚽ *قائمة المباراة*\n━━━━━━━━━━━━━━\n';
  if(opponent) msg+='🆚 المنافس: *'+opponent+'*\n';
  if(dateStr)  msg+='📅 التاريخ: '+dateStr+'\n';
  if(time)     msg+='⏰ الوقت: '+time+'\n';
  if(venue)    msg+='📍 الملعب: '+venue+'\n';
  msg+='━━━━━━━━━━━━━━\n👕 *اللاعبون ('+selected.length+')*\n';
  selected.forEach(function(name,i){msg+=(i+1)+'. '+name+'\n';});
  msg+='━━━━━━━━━━━━━━\n🇴🇲 بالتوفيق للجميع!';
  window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(msg),'_blank');
}

function editOpenCropper(input, pid){
  if(!input.files||!input.files[0]) return;
  var reader = new FileReader();
  reader.onload = function(e){
    _showCropper(e.target.result, function(dataUrl){
      try{ localStorage.setItem('kaasPhoto_'+pid, dataUrl); }catch(x){}
      var ring = document.getElementById('editPhotoRing');
      if(ring) ring.innerHTML = '<img src="'+dataUrl+'" style="width:100%;height:100%;object-fit:cover;">';
      window._editNewPhoto = dataUrl;
    });
  };
  reader.readAsDataURL(input.files[0]);
}

function sharePlayerWhatsapp(pid){
  var p = (window._kaasPlayers||[]).find(function(x){ return x.id===pid; });
  if(!p) return;
  var edit = {};
  try{ edit = JSON.parse(localStorage.getItem('kaasEdit_'+pid)||'{}'); }catch(e){}
  var name     = edit.name    || p.name    || '';
  var birth    = (edit.birth  || p.birth   || '').toString().split('T')[0];
  var nat      = edit.nationality || p.nationality || p.nat || '';
  var jersey   = edit.jersey  || p.jersey  || '';
  var cat      = p.cat_name   || p.catName || '';
  var acadName = sessionStorage.getItem('kaasAcadName') || p.academy_name || '';
  var msg =
    '🏆 *'+CONFIG.TOURNAMENT_NAME+'*\n'+
    '─────────────────\n'+
    '👤 *اللاعب:* '+name+'\n'+
    '🎂 *تاريخ الميلاد:* '+birth+'\n'+
    (nat    ? '🌍 *الجنسية:* '+nat+'\n'       : '')+
    (cat    ? '⚽ *الفئة:* '+cat+'\n'         : '')+
    (jersey ? '👕 *رقم القميص:* #'+jersey+'\n': '')+
    '🏫 *الأكاديمية:* '+acadName+'\n'+
    '─────────────────\n'+
    '📋 *الموسم:* '+CONFIG.SEASON;

  /* بناء بطاقة اللاعب وتحويلها إلى صورة PNG ثم مشاركتها */
  var wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;left:-9999px;top:0;width:340px;z-index:-1;background:#f1f5f9;padding:16px;';
  wrap.innerHTML = buildKaasCardHTML(p, 1);
  document.body.appendChild(wrap);

  var loadingBtn = document.querySelector('[onclick="sharePlayerWhatsapp(\''+pid+'\')"]');
  if(loadingBtn){ loadingBtn.disabled=true; loadingBtn.innerHTML='<i class="fas fa-spinner fa-spin"></i>'; }

  setTimeout(function(){
    html2canvas(wrap, {scale:2, useCORS:true, backgroundColor:'#f1f5f9', logging:false}).then(function(canvas){
      document.body.removeChild(wrap);
      if(loadingBtn){ loadingBtn.disabled=false; loadingBtn.innerHTML='<i class="fab fa-whatsapp"></i> واتساب'; }

      canvas.toBlob(function(blob){
        var file = new File([blob], 'بطاقة-'+name+'.png', {type:'image/png'});
        if(navigator.canShare && navigator.canShare({files:[file]})){
          navigator.share({files:[file], text:msg}).catch(function(){
            /* fallback: واتساب نص فقط */
            window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(msg),'_blank');
          });
        } else {
          /* fallback للمتصفحات التي لا تدعم share */
          window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(msg),'_blank');
        }
      }, 'image/png');
    }).catch(function(){
      document.body.removeChild(wrap);
      if(loadingBtn){ loadingBtn.disabled=false; loadingBtn.innerHTML='<i class="fab fa-whatsapp"></i> واتساب'; }
      window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(msg),'_blank');
    });
  }, 200);
}
