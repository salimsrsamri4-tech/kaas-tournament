function renderPublicMatchSchedule(){
  showL();
  Promise.all([apiGet('جدول المباريات'), apiGet('نتائج المباريات')]).then(function(res){
    var rows=res[0]||[], resultRows=res[1]||[];
    // بناء فهرس النتائج: الفريق الأول + الفريق الثاني + الفئة → النتيجة
    var resultsMap={};
    resultRows.forEach(function(r){
      var t1=(r['الفريق الأول']||r.team1||'').trim();
      var t2=(r['الفريق الثاني']||r.team2||'').trim();
      var cat=(r['الفئة']||r.cat_id||'').trim();
      var res2=(r['النتيجة']||r.result||'').trim();
      if(t1&&t2&&res2){
        resultsMap[t1+'|'+t2+'|'+cat]=res2;
        resultsMap[t2+'|'+t1+'|'+cat]=res2;
      }
    });
    rows = rows; // نمرر resultsMap للدالة الداخلية
    if(!Array.isArray(rows)) rows=[];
    if(!Array.isArray(rows)) rows=[];
    function fmtDate(v){
      if(!v) return 'غير محدد';
      var s=String(v);
      var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if(m) return m[3]+'/'+m[2]+'/'+m[1];
      return s;
    }
    function fmtTime(v){
      if(!v) return '';
      var s=String(v);
      var m=s.match(/T(\d{2}):(\d{2})/);
      if(m) return m[1]+':'+m[2];
      if(/^\d{2}:\d{2}/.test(s)) return s.slice(0,5);
      return s;
    }
    // تجميع حسب التاريخ

function renderPublicResults(){

    if(!v) return '';
    var s=String(v);
    var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m) return m[3]+'/'+m[2]+'/'+m[1];
    return s;

  apiGet('نتائج المباريات').then(function(rows){
    if(!Array.isArray(rows)) rows=[];

      '<div style="background:linear-gradient(135deg,#0d3318,#1b5e2e);padding:20px 16px;color:#fff;display:flex;align-items:center;gap:10px;">'+

      rows.slice().reverse().forEach(function(m){
        var team1=m['الفريق الأول']||m.team1||'؟';
        var team2=m['الفريق الثاني']||m.team2||'؟';
        var result=m['النتيجة']||m.result||'';

// ════════════════════════════════════════
// إدارة الفرق (admin)
// ════════════════════════════════════════
function renderAdminTeams(){
  if(!sessionStorage.getItem('kaasAdmin')){go('admin_login');return;}
  showL();
  Promise.all([apiGet('الفرق'), apiGet('الأكاديميات'), apiGet('فرق محذوفة')]).then(function(res){
    var teams=res[0]||[], acadList=res[1]||[], deleted=res[2]||[];
    if(!Array.isArray(teams)) teams=[];
    if(!Array.isArray(acadList)) acadList=[];
    if(!Array.isArray(deleted)) deleted=[];
    // بناء قائمة المحذوفين (سيرفر + محلي)
    var deletedKeys={};
    deleted.forEach(function(d){ var k=(d['الاسم']||'')+'|'+(d['الفئة']||''); deletedKeys[k]=true; });
    var localDel = JSON.parse(sessionStorage.getItem('_localDeleted')||'[]');
    localDel.forEach(function(d){ var k=(d['الاسم']||'')+'|'+(d['الفئة']||''); deletedKeys[k]=true; });
    // فلترة المحذوفين وإزالة التكرار
    var seenTeams={};
    teams = teams.filter(function(t){
      var n=(t['الاسم']||'').trim(), c=(t['الفئة']||'').trim();
      if(!n||!c) return false;
      var k=n+'|'+c;
      if(deletedKeys[k]) return false;
      if(seenTeams[k]) return false;
      seenTeams[k]=true; return true;
    });
    var selCat = window._teamsSelCat || CATEGORIES[0].id;
    var catTabs = CATEGORIES.map(function(c){
      return '<button onclick="window._teamsSelCat=\''+c.id+'\';renderAdminTeams();" style="padding:6px 12px;border-radius:20px;border:none;font-family:Cairo,sans-serif;font-size:11px;font-weight:800;cursor:pointer;background:'+(selCat===c.id?c.color:'#f1f5f9')+';color:'+(selCat===c.id?'#fff':'#475569')+';">'+c.name+'</button>';
    }).join('');
    var ci = CATEGORIES.find(function(c){return c.id===selCat;});
    var color = ci?ci.color:'#0d3318';

    // الأكاديميات المعتمدة التي لم تُضف بعد لهذه الفئة
    var addedNames = teams.filter(function(t){return (t['الفئة']||'')=== selCat;}).map(function(t){return t['الاسم']||'';});
    var INVALID = ['الاسم','اسم الأكاديمية','name',''];
    var availableAcads = acadList.filter(function(a){
      var n=(a.name||a['الاسم']||'').trim();
      return n && INVALID.indexOf(n)<0 && addedNames.indexOf(n)<0;
    });
    // إزالة التكرار
    var seen={};
    availableAcads = availableAcads.filter(function(a){
      var n=(a.name||a['الاسم']||'').trim();
      if(seen[n]) return false;
      seen[n]=true; return true;
    });
    var acadOpts = '<option value="">-- اختر أكاديمية معتمدة --</option>'+
      availableAcads.map(function(a){
        var n=(a.name||a['الاسم']||'').trim();
        return '<option value="'+n+'">'+n+'</option>';
      }).join('');

    var filtered = teams.filter(function(t){return (t['الفئة']||'')=== selCat;});
    var groups = {};
    filtered.forEach(function(t){
      var g = t['المجموعة']||'بدون مجموعة';
      if(!groups[g]) groups[g]=[];
      groups[g].push(t['الاسم']||t.name||'');
    });

    var teamsHtml = '';
    if(!filtered.length){
      teamsHtml = '<div style="text-align:center;color:#94a3b8;padding:20px;font-size:13px;">لا توجد فرق مسجلة في هذه الفئة</div>';
    } else {
      ['A','B','C','D','E','F','بدون مجموعة'].forEach(function(g){
        var arr = groups[g]||groups['المجموعة '+g]||[];
        if(!arr.length) return;
        teamsHtml+='<div style="margin-bottom:10px;">'+
          '<div style="font-size:11px;font-weight:900;color:'+color+';margin-bottom:6px;display:flex;align-items:center;gap:6px;">'+
            '<span style="background:'+color+';color:#fff;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;">'+(g==='بدون مجموعة'?'?':g)+'</span>'+
            'المجموعة '+(g==='بدون مجموعة'?'غير محددة':g)+' — '+arr.length+' فرق'+
          '</div>'+
          arr.map(function(n){
            return '<div style="background:#f8fafc;border-radius:8px;padding:8px 12px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;">'+
              '<span><i class="fas fa-shield-alt" style="color:'+color+';margin-left:6px;font-size:11px;"></i>'+n+'</span>'+
              '<button onclick="deleteTeam(\''+n.replace(/'/g,"\\'")+'\',\''+selCat+'\')" style="background:#fff0f0;color:#b91c1c;border:1px solid #fecaca;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;font-family:Cairo,sans-serif;">حذف</button>'+
            '</div>';
          }).join('')+
        '</div>';
      });
    }

    document.getElementById('app').innerHTML=
      '<div style="background:linear-gradient(135deg,#0d3318,#1b5e2e);padding:20px 16px 14px;display:flex;align-items:center;gap:12px;color:#fff;">'+
        '<button onclick="go(\'admin_panel\')" style="background:rgba(255,255,255,.15);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="fas fa-arrow-right"></i></button>'+
        '<div><div style="font-size:15px;font-weight:900;">🏟️ إدارة الفرق</div><div style="font-size:10px;opacity:.7;">'+filtered.length+' فريق مسجل — '+availableAcads.length+' أكاديمية معتمدة متاحة</div></div>'+
      '</div>'+
      '<div style="padding:14px;">'+
        '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;">'+catTabs+'</div>'+

        /* إضافة من الأكاديميات المعتمدة */
        (availableAcads.length?
          '<div class="card" style="margin-bottom:12px;border:2px solid '+color+'20;">'+
            '<div class="sec-title" style="color:'+color+';">🏫 إضافة من الأكاديميات المعتمدة</div>'+
            '<div class="r2 mb">'+
              '<div><label class="lbl">اختر الأكاديمية</label>'+
              '<select class="inp" id="newTeamAcad">'+acadOpts+'</select></div>'+
              '<div><label class="lbl">المجموعة</label>'+
              '<select class="inp" id="newTeamGroupAcad">'+
                '<option value="">تحديد لاحقاً</option>'+
                ['A','B','C','D','E','F'].map(function(g){return '<option value="'+g+'">المجموعة '+g+'</option>';}).join('')+
              '</select></div>'+
            '</div>'+
            '<button onclick="addTeamFromAcad(\''+selCat+'\')" class="btn" style="background:linear-gradient(135deg,'+color+','+color+'cc);color:#fff;width:100%;">'+
              '<i class="fas fa-plus-circle"></i> إضافة للبطولة</button>'+
          '</div>'
        :'') +

        /* إضافة يدوية */
        '<div class="card" style="margin-bottom:12px;">'+
          '<div class="sec-title">✏️ إضافة فريق يدوياً</div>'+
          '<div class="r2 mb">'+
            '<div><label class="lbl">اسم الفريق</label><input class="inp" id="newTeamName" placeholder="اسم الفريق..."></div>'+
            '<div><label class="lbl">المجموعة</label>'+
            '<select class="inp" id="newTeamGroup">'+
              '<option value="">تحديد لاحقاً</option>'+
              ['A','B','C','D','E','F'].map(function(g){return '<option value="'+g+'">المجموعة '+g+'</option>';}).join('')+
            '</select></div>'+
          '</div>'+
          '<button onclick="addTeam(\''+selCat+'\')" class="btn" style="background:linear-gradient(135deg,#0d3318,#1b5e2e);color:#fff;width:100%;">'+
            '<i class="fas fa-plus"></i> إضافة</button>'+
        '</div>'+
        '<div class="card">'+
          '<div class="sec-title">📋 الفرق المسجلة ('+filtered.length+')</div>'+
          teamsHtml+
        '</div>'+
        '<button onclick="renderAdminGroupGen();" class="btn" style="background:linear-gradient(135deg,#d4af37,#92700a);color:#fff;width:100%;margin-top:12px;font-size:14px;">'+
          '<i class="fas fa-magic"></i> توليد جدول المجموعات تلقائياً</button>'+
      '</div>';
  });
}

function addTeamFromAcad(catId){
  var name=(document.getElementById('newTeamAcad').value||'').trim();
  var group=document.getElementById('newTeamGroupAcad').value;
  if(!name){alert('اختر أكاديمية');return;}
  apiAppend('الفرق',{'الاسم':name,'الفئة':catId,'المجموعة':group?'المجموعة '+group:''}).then(function(){
    invalidateCache('الفرق');
    setTimeout(renderAdminTeams,500);
  });
}

function addTeam(catId){
  var name=(document.getElementById('newTeamName').value||'').trim();
  var group=document.getElementById('newTeamGroup').value;
  if(!name){alert('أدخل اسم الفريق');return;}
  apiAppend('الفرق',{'الاسم':name,'الفئة':catId,'المجموعة':group?'المجموعة '+group:''}).then(function(){
    invalidateCache('الفرق');
    document.getElementById('newTeamName').value='';
    setTimeout(renderAdminTeams,500);
  });
}

function deleteTeam(name,catId){
  if(!confirm('حذف فريق "'+name+'"؟')) return;
  // حذف فوري محلي في sessionStorage
  var localDel = JSON.parse(sessionStorage.getItem('_localDeleted')||'[]');
  localDel.push({الاسم:name,الفئة:catId});
  sessionStorage.setItem('_localDeleted', JSON.stringify(localDel));
  // إرسال للسيرفر (لا نحتاج انتظار الرد)
  apiAppend('فرق محذوفة',{'الاسم':name,'الفئة':catId,'وقت':new Date().toISOString()});
  invalidateCache('الفرق');
  invalidateCache('فرق محذوفة');
  renderAdminTeams();
}

function generateGroupMatches(catId){
  Promise.all([apiGet('الفرق'), apiGet('فرق محذوفة')]).then(function(res){
    var teams=res[0]||[], deleted=res[1]||[];
    if(!Array.isArray(teams)) teams=[];
    if(!Array.isArray(deleted)) deleted=[];
    // فلترة المحذوفين + المحلي + إزالة التكرار
    var deletedKeys={};
    deleted.forEach(function(d){ deletedKeys[(d['الاسم']||'')+'|'+(d['الفئة']||'')]=true; });
    var localDel = JSON.parse(sessionStorage.getItem('_localDeleted')||'[]');
    localDel.forEach(function(d){ deletedKeys[(d['الاسم']||'')+'|'+(d['الفئة']||'')]=true; });
    var seen={};
    teams = teams.filter(function(t){
      var n=(t['الاسم']||'').trim(), c=(t['الفئة']||'').trim();
      if(!n||!c) return false;
      var k=n+'|'+c;
      if(deletedKeys[k]||seen[k]) return false;
      seen[k]=true; return true;
    });
    var filtered = teams.filter(function(t){return (t['الفئة']||'')=== catId;});
    var groups = {};
    filtered.forEach(function(t){
      var g = t['المجموعة']||'بدون مجموعة';
      if(!groups[g]) groups[g]=[];
      groups[g].push(t['الاسم']||'');
    });
    var startDate = document.getElementById('genStartDate')?document.getElementById('genStartDate').value:'';
    var genTime = document.getElementById('genTime')?document.getElementById('genTime').value:'';
    var allMatches = [];
    Object.keys(groups).sort().forEach(function(g){
      var arr = groups[g];
      var venueEl = document.getElementById('genVenue_'+g.replace(/\s/g,'_'));
      var venue = venueEl?(venueEl.value||'').trim():'';
      for(var i=0;i<arr.length;i++){
        for(var j=i+1;j<arr.length;j++){
          allMatches.push({
            'الفريق الأول':arr[i], 'الفريق الثاني':arr[j],
            'التاريخ':startDate, 'الوقت':genTime, 'الملعب':venue,
            'الفئة':catId, 'المجموعة':g, 'المرحلة':'دور المجموعات', 'النتيجة':''
          });
        }
      }
    });
    if(!allMatches.length){alert('لا توجد مباريات لتوليدها');return;}
    // انتقل لمحرر المواعيد
    window._pendingMatches = allMatches;
    window._pendingCatId = catId;
    renderMatchScheduleEditor();
  });
}

function saveAllPendingMatches(){
  var matches = window._pendingMatches || [];
  // قراءة القيم المعدّلة
  document.querySelectorAll('.pm-date').forEach(function(el){
    var idx=parseInt(el.dataset.idx); if(matches[idx]) matches[idx]['التاريخ']=el.value;
  });
  document.querySelectorAll('.pm-time').forEach(function(el){
    var idx=parseInt(el.dataset.idx); if(matches[idx]) matches[idx]['الوقت']=el.value;
  });
  document.querySelectorAll('.pm-venue').forEach(function(el){
    var idx=parseInt(el.dataset.idx); if(matches[idx]) matches[idx]['الملعب']=el.value;
  });

  var btn=document.querySelector('[onclick="saveAllPendingMatches()"]');
  btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> جارٍ الحفظ...';

  var promises = matches.map(function(m){ return apiAppend('جدول المباريات',m); });
  Promise.all(promises).then(function(){
    invalidateCache('جدول المباريات');
    window._pendingMatches=[];
    alert('✅ تم حفظ '+matches.length+' مباراة بنجاح!');
    go('admin_panel');
  }).catch(function(){
    alert('⚠️ تم الإرسال — قد يستغرق ظهوره بضع دقائق');
    go('admin_panel');
  });
}

function renderTopScorers(){
  showL();
  var selCat = window._tsSelCat || 'all';
  apiGet('نتائج المباريات').then(function(rows){
    if(!Array.isArray(rows)) rows=[];

    // بناء قاموس الهدافين من حقل الأهداف JSON
    var scorers = {}; // key: "اسم|فريق|فئة"
    rows.forEach(function(m){
      var cat = m['الفئة']||'';
      var goalsRaw = m['الأهداف']||'[]';
      var goals = [];
      try{ goals = JSON.parse(goalsRaw); }catch(e){}
      if(!Array.isArray(goals)) return;
      goals.forEach(function(g){
        if(!g.player || !g.player.trim()) return;
        if((g.type||'')==='مرمى ذاتي') return; // لا تُحسب للاعب
        var key = (g.player.trim())+'||'+(g.team||'')+'||'+cat;
        if(!scorers[key]) scorers[key]={name:g.player.trim(), team:g.team||'', cat:cat, goals:0, pens:0};
        scorers[key].goals++;
        if((g.type||'')==='ركلة جزاء') scorers[key].pens++;
      });
    });

    var list = Object.values(scorers);
    // فلتر الفئة
    if(selCat !== 'all') list = list.filter(function(s){ return s.cat===selCat; });
    // ترتيب تنازلي
    list.sort(function(a,b){ return b.goals - a.goals; });

    // تبويبات الفئات
    var tabsHtml =
      '<div style="display:flex;gap:6px;padding:12px 14px;overflow-x:auto;background:#fff;border-bottom:1px solid #f1f5f9;">' +
      '<button onclick="window._tsSelCat=\'all\';renderTopScorers();" style="flex-shrink:0;padding:6px 14px;border-radius:20px;border:none;font-size:11px;font-weight:800;cursor:pointer;font-family:Cairo,sans-serif;background:'+(selCat==='all'?'#0d3318':'#f1f5f9')+';color:'+(selCat==='all'?'#fff':'#475569')+';">الكل</button>' +
      CATEGORIES.map(function(c){
        var active = selCat===c.id;
        return '<button onclick="window._tsSelCat=\''+c.id+'\';renderTopScorers();" style="flex-shrink:0;padding:6px 14px;border-radius:20px;border:none;font-size:11px;font-weight:800;cursor:pointer;font-family:Cairo,sans-serif;background:'+(active?c.color:'#f1f5f9')+';color:'+(active?'#fff':'#475569')+';">'+c.name+'</button>';
      }).join('')+
      '</div>';

    var listHtml = '';
    if(!list.length){
      listHtml = '<div style="background:#fff;border-radius:14px;padding:40px;text-align:center;color:#94a3b8;font-size:13px;">لا توجد بيانات أهداف بعد</div>';
    } else {
      listHtml = '<div style="background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.07);">';
      list.forEach(function(s, i){
        var ci = CATEGORIES.find(function(c){return c.id===s.cat;})||{color:'#0d3318',name:''};
        var medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
        var rankStyle = i===0 ? 'background:linear-gradient(135deg,#fef9c3,#fef08a);' : i===1 ? 'background:linear-gradient(135deg,#f1f5f9,#e2e8f0);' : i===2 ? 'background:linear-gradient(135deg,#fff7ed,#fed7aa);' : 'background:#fff;';
        listHtml +=
          '<div style="'+rankStyle+'padding:12px 16px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:12px;">'+
            '<div style="width:32px;height:32px;border-radius:50%;background:'+(i<3?ci.color:'#e2e8f0')+';display:flex;align-items:center;justify-content:center;font-size:'+(i<3?'16px':'13px')+';font-weight:900;color:#fff;flex-shrink:0;">'+
              (medal || (i+1))+
            '</div>'+
            '<div style="flex:1;min-width:0;">'+
              '<div style="font-size:14px;font-weight:900;color:#0f172a;">'+s.name+'</div>'+
              '<div style="font-size:10px;color:#64748b;font-weight:700;margin-top:2px;">'+
                '<span style="background:'+ci.color+'22;color:'+ci.color+';padding:1px 7px;border-radius:8px;font-size:9px;font-weight:900;">'+ci.name+'</span>'+
                ' '+s.team+
              '</div>'+
            '</div>'+
            '<div style="text-align:center;flex-shrink:0;">'+
              '<div style="font-size:26px;font-weight:900;color:'+(i===0?'#d97706':i===1?'#64748b':i===2?'#b45309':'#0d3318')+';">'+s.goals+'</div>'+
              '<div style="font-size:9px;color:#94a3b8;font-weight:700;">هدف</div>'+
              (s.pens?'<div style="font-size:9px;color:#94a3b8;">('+s.pens+' ج)</div>':'')+
            '</div>'+
          '</div>';
      });
      listHtml += '</div>';
    }

    // إجمالي الأهداف
    var totalGoals = list.reduce(function(s,x){return s+x.goals;},0);

    document.getElementById('app').innerHTML =
      '<div style="background:linear-gradient(135deg,#b45309,#92400e);padding:20px 16px 16px;color:#fff;">'+
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">'+
          '<button onclick="go(\'home\')" style="background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 12px;border-radius:8px;font-size:11px;cursor:pointer;font-family:Cairo,sans-serif;">← رجوع</button>'+
          '<div>'+

            '<div style="font-size:10px;opacity:.7;">'+list.length+' هداف · '+totalGoals+' هدف مسجل</div>'+

function renderGroupStandings(){
  showL();
  var selCat = window._gsSelCat || CATEGORIES[0].id;
  Promise.all([apiGet('الفرق'), apiGet('نتائج المباريات')]).then(function(res){
    var teams=res[0]||[], results=res[1]||[];
    var ci = CATEGORIES.find(function(c){return c.id===selCat;});
    var catTabs = CATEGORIES.map(function(c){
      return '<button onclick="window._gsSelCat=\''+c.id+'\';renderGroupStandings();" style="padding:6px 14px;border-radius:20px;border:none;font-family:Cairo,sans-serif;font-size:11px;font-weight:800;cursor:pointer;background:'+(selCat===c.id?c.color:'#f1f5f9')+';color:'+(selCat===c.id?'#fff':'#475569')+';">'+c.name+'</button>';
    }).join('');

    var filtered = teams.filter(function(t){return (t['الفئة']||'')=== selCat && t['الاسم'];});
    var groups = {};
    filtered.forEach(function(t){
      var g = t['المجموعة']||'غير محددة';
      if(!groups[g]) groups[g]=[];
      groups[g].push(t['الاسم']);
    });

    function computeTable(groupName, teamNames){
      var table = {};
      teamNames.forEach(function(n){ table[n]={name:n,P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0}; });
      results.forEach(function(r){
        if((r['الفئة']||r.cat_id||'')!==selCat) return;
        if((r['المجموعة']||'')!==groupName && (r['المجموعة']||'')!==('المجموعة '+groupName)) return;
        var t1=r['الفريق الأول']||r.team1||'';
        var t2=r['الفريق الثاني']||r.team2||'';
        var res=r['النتيجة']||r.result||'';
        var m=res.match(/(\d+)\s*[-–]\s*(\d+)/);
        if(!m) return;
        var g1=parseInt(m[1]),g2=parseInt(m[2]);
        if(table[t1]){ table[t1].P++;table[t1].GF+=g1;table[t1].GA+=g2;table[t1].GD+=g1-g2;
          if(g1>g2){table[t1].W++;table[t1].Pts+=3;}else if(g1===g2){table[t1].D++;table[t1].Pts+=1;}else{table[t1].L++;} }
        if(table[t2]){ table[t2].P++;table[t2].GF+=g2;table[t2].GA+=g1;table[t2].GD+=g2-g1;
          if(g2>g1){table[t2].W++;table[t2].Pts+=3;}else if(g1===g2){table[t2].D++;table[t2].Pts+=1;}else{table[t2].L++;} }
      });
      return Object.values(table).sort(function(a,b){
        if(b.Pts!==a.Pts) return b.Pts-a.Pts;
        if(b.GD!==a.GD) return b.GD-a.GD;
        return b.GF-a.GF;
      });
    }

    var groupsHtml='';
    if(!filtered.length){
      groupsHtml='<div style="background:#fff;border-radius:14px;padding:32px;text-align:center;color:#94a3b8;font-size:13px;">لم يتم إعداد المجموعات بعد</div>';
    } else {
      Object.keys(groups).sort().forEach(function(g){
        var rows=computeTable(g,groups[g]);
        var color=ci?ci.color:'#0d3318';
        groupsHtml+=
          '<div style="background:#fff;border-radius:14px;margin-bottom:14px;overflow:hidden;border:1px solid #e2e8f0;box-shadow:0 2px 8px rgba(0,0,0,.06);">'+
            '<div style="background:'+color+';color:#fff;padding:10px 14px;display:flex;align-items:center;gap:8px;">'+
              '<span style="width:26px;height:26px;background:rgba(255,255,255,.2);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;">'+g.replace('المجموعة ','')+'</span>'+

function hexToRgb(hex){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return r+','+g+','+b;
}

function renderKnockoutBracket(){
  showL();
  var selCat = window._kbSelCat || CATEGORIES[0].id;
  apiGet('الإقصائي').then(function(matches){
    if(!Array.isArray(matches)) matches=[];
    var ci = CATEGORIES.find(function(c){return c.id===selCat;});
    var color = ci?ci.color:'#b81d22';
    var catTabs = CATEGORIES.map(function(c){
      return '<button onclick="window._kbSelCat=\''+c.id+'\';renderKnockoutBracket();" style="padding:6px 14px;border-radius:20px;border:none;font-family:Cairo,sans-serif;font-size:11px;font-weight:800;cursor:pointer;background:'+(selCat===c.id?c.color:'#f1f5f9')+';color:'+(selCat===c.id?'#fff':'#475569')+';">'+c.name+'</button>';
    }).join('');

    var filtered = matches.filter(function(m){return (m['الفئة']||'')=== selCat;});
    var stages = ['دور الـ16','ربع النهائي','نصف النهائي','نهائي المركز الثالث','النهائي'];
    var byStage = {};
    stages.forEach(function(s){byStage[s]=[];});
    filtered.forEach(function(m){
      var s=m['المرحلة']||'';
      if(byStage[s]) byStage[s].push(m);
    });

    var bracketHtml='';

function saveKnockoutMatch(catId){
  var stage=(document.getElementById('akStage').value||'').trim();
  var t1=(document.getElementById('akT1').value||'').trim();
  var t2=(document.getElementById('akT2').value||'').trim();
  var date=document.getElementById('akDate').value;
  var time=document.getElementById('akTime').value;
  var result=(document.getElementById('akResult').value||'').trim();
  var winner=(document.getElementById('akWinner').value||'').trim();
  if(!t1||!t2){alert('أدخل اسمي الفريقين');return;}
  var row={'المرحلة':stage,'الفريق الأول':t1,'الفريق الثاني':t2,'التاريخ':date,'الوقت':time,'النتيجة':result,'الفائز':winner,'الفئة':catId};
  var btn=document.querySelector('[onclick*="saveKnockoutMatch"]');
  btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> جارٍ الحفظ...';
  apiAppend('الإقصائي',row).then(function(){
    invalidateCache('الإقصائي');
    alert('✅ تم حفظ المباراة الإقصائية!');
    renderAdminKnockout();
  }).catch(function(){
    alert('⚠️ تم الإرسال');
    renderAdminKnockout();
  });
}

// ════════════════════════════════════════
// تصدير بيانات CSV/Excel
// ════════════════════════════════════════
function exportToCSV(){
  showL();
  Promise.all([apiGet('الأكاديميات'),apiGet('اللاعبون')]).then(function(res){
    var acadList=res[0]||[];
    var players=res[1]||[];
    // BOM for Excel Arabic support
    var BOM='﻿';
    // Sheet 1: academies
    var acadCsv=BOM+'اسم الأكاديمية,المدينة,الهاتف,الفئات,عدد اللاعبين,الحالة\n'+
      acadList.map(function(a){
        return [a.name||'',a.city||'',a.phone||'',a.cats||'',a.players||'',a.status||''].map(function(v){
          return '"'+String(v).replace(/"/g,'""')+'"';
        }).join(',');
      }).join('\n');
    var playersCsv='\n\nاسم اللاعب,تاريخ الميلاد,رقم القميص,الفئة,الأكاديمية\n'+
      players.map(function(p){
        return [p.name||'',p.birth||'',p.jersey||'',p.cat_id||'',p.academy_name||''].map(function(v){
          return '"'+String(v).replace(/"/g,'""')+'"';
        }).join(',');
      }).join('\n');
    var blob=new Blob([acadCsv+playersCsv],{type:'text/csv;charset=utf-8;'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download='KAAS_Data_'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    hideL();
  }).catch(function(){ hideL(); alert('فشل التصدير، حاول مجدداً'); });
}

          '<div style="width:64px;height:64px;border-radius:16px;background:rgba(212,175,55,.3);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#ffdd57;margin:0 auto 12px;">'+
            name.split(' ').map(function(w){return w[0]||'';}).join('').slice(0,2)+
          '</div>'+
          '<div style="font-size:18px;font-weight:900;color:#fff;margin-bottom:4px;">'+name+'</div>'+
          '<div style="font-size:11px;color:rgba(255,255,255,.6);margin-bottom:12px;">'+id+' · '+CONFIG.TOURNAMENT_NAME+'</div>'+
          '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;">'+
            '<div style="background:rgba(255,255,255,.1);border-radius:10px;padding:10px;">'+
              '<div style="font-size:20px;font-weight:900;color:var(--gold);">'+players.length+'</div>'+
              '<div style="font-size:9px;color:rgba(255,255,255,.6);">لاعب</div>'+
            '</div>'+
            '<div style="background:rgba(255,255,255,.1);border-radius:10px;padding:10px;">'+
              '<div style="font-size:20px;font-weight:900;color:var(--gold);">'+cats.length+'</div>'+
              '<div style="font-size:9px;color:rgba(255,255,255,.6);">فئات</div>'+
            '</div>'+
            '<div style="background:rgba(255,255,255,.1);border-radius:10px;padding:10px;">'+
              '<div style="font-size:20px;font-weight:900;color:#10b981;">✓</div>'+
              '<div style="font-size:9px;color:rgba(255,255,255,.6);">مسجل</div>'+
            '</div>'+
          '</div>'+
          '<div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;">'+
            cats.map(function(c){
              var ci=getCatInfo(c);
              return '<span style="background:rgba(212,175,55,.25);border:1px solid rgba(212,175,55,.5);color:#ffdd57;font-size:10px;font-weight:800;padding:3px 10px;border-radius:10px;">'+(ci?ci.name:catLabels[c]||c)+' ('+( catByCat[c]||0)+' لاعب)</span>';
            }).join('')+
          '</div>'+
          '<div style="margin-top:12px;font-size:10px;color:rgba(255,255,255,.5);">'+CONFIG.SEASON+' · KAAS</div>'+
        '</div>'+
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">'+
          '<button onclick="window.print()" class="btn btn-dark" style="padding:11px;"><i class="fas fa-print"></i> طباعة</button>'+
          '<button onclick="this.closest(\'.modal-bg\').remove()" class="btn btn-light" style="padding:11px;">إغلاق</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  document.body.insertAdjacentHTML('beforeend',cardHtml);
}

// ════════════════════════════════════════
// تهيئة العناصر من CONFIG
// ════════════════════════════════════════
(function applyConfig(){
  // عنوان الصفحة
  document.title = CONFIG.TOURNAMENT_SHORT + ' — ' + CONFIG.TOURNAMENT_NAME;

  // شاشة البداية
  var st = document.getElementById('splashTitle');
  var ss = document.getElementById('splashSub');
  if(st) st.textContent = CONFIG.TOURNAMENT_NAME;
  if(ss) ss.textContent = CONFIG.TOURNAMENT_NAME_EN.toUpperCase() + ' · ' + CONFIG.TOURNAMENT_SHORT;

  // النافبار
  var nt = document.getElementById('navTitle');
  var ns = document.getElementById('navSub');
  var nb = document.getElementById('navBrand');
  if(nt) nt.textContent = CONFIG.TOURNAMENT_NAME;
  if(ns) ns.textContent = CONFIG.TOURNAMENT_NAME_EN.toUpperCase() + ' (' + CONFIG.TOURNAMENT_SHORT + ')';
  if(nb) nb.textContent = CONFIG.TOURNAMENT_SHORT;

  // الشريط الجانبي
  var sd = document.getElementById('sidebarTitle');
  var ss2 = document.getElementById('sidebarSub');
  if(sd) sd.textContent = CONFIG.TOURNAMENT_NAME;
  if(ss2) ss2.textContent = 'KAAS · ' + CONFIG.TOURNAMENT_NAME_EN.toUpperCase();

  // ألوان CSS
  var root = document.documentElement;
  root.style.setProperty('--primary', CONFIG.COLOR_PRIMARY);
  root.style.setProperty('--secondary', CONFIG.COLOR_SECONDARY);
  root.style.setProperty('--accent', CONFIG.COLOR_ACCENT);
})();

// شاشة الترحيب
setTimeout(function(){
  var splash = document.getElementById('splash');
  if(splash){ splash.style.opacity='0'; setTimeout(function(){ splash.style.display='none'; }, 600); }
}, 2000);
</script>
