<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>KAAS — كأس العرب للأكاديميات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Cairo',sans-serif;background:#f4f6f4;color:#0f172a;direction:rtl;}
:root{--red:#b81d22;--green:#1b5e2e;--light-green:#2d7a40;--dark:#0f172a;--gold:#d4af37;}

/* شريط التنقل */
.navbar{background:linear-gradient(135deg,#0d3318,#1b5e2e);padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between;position:fixed;top:0;left:0;right:0;z-index:100;border-bottom:3px solid var(--red);}
.nav-brand{display:flex;align-items:center;gap:10px;}
.nav-logo{width:36px;height:36px;background:var(--red);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff;flex-shrink:0;letter-spacing:-1px;}
.nav-title{font-size:13px;font-weight:900;color:#fff;line-height:1.2;}
.nav-sub{font-size:9px;color:rgba(255,255,255,.65);font-weight:700;letter-spacing:.5px;}
.nav-btns{display:flex;gap:8px;}
.nav-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;padding:6px 12px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;}
.nav-btn.gold{background:var(--red);border-color:var(--red);color:#fff;}

/* المحتوى */
#app{margin-top:56px;min-height:calc(100vh - 56px);}

/* البطل */
.hero{background:linear-gradient(160deg,#0d3318 0%,#1b5e2e 60%,#0d3318 100%);padding:48px 20px 40px;text-align:center;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Ccircle cx='30' cy='30' r='28'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");}
.hero-badge{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:11px;font-weight:800;padding:4px 14px;border-radius:20px;margin-bottom:16px;letter-spacing:.5px;}
.hero h1{font-size:26px;font-weight:900;color:#fff;margin-bottom:6px;position:relative;}
.hero h1 span{color:#ffdd57;}
.hero p{font-size:12px;color:rgba(255,255,255,.75);font-weight:600;margin-bottom:24px;position:relative;}
.hero-stats{display:flex;justify-content:center;gap:24px;position:relative;}
.hstat{text-align:center;}
.hstat-n{font-size:22px;font-weight:900;color:#ffdd57;}
.hstat-l{font-size:10px;color:rgba(255,255,255,.6);font-weight:600;}

/* الأقسام */
.section{padding:16px;}
.sec-title{font-size:14px;font-weight:900;color:var(--dark);margin-bottom:12px;display:flex;align-items:center;gap:8px;border-bottom:2px solid #e2e8f0;padding-bottom:8px;}

/* بطاقات الفئات */
.cats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
.cat-card{background:#fff;border-radius:14px;padding:14px;border-top:3px solid var(--green);box-shadow:0 2px 8px rgba(0,0,0,.06);}
.cat-name{font-size:12px;font-weight:900;color:var(--dark);margin-bottom:4px;}
.cat-years{font-size:10px;color:#64748b;font-weight:600;line-height:1.6;}
.cat-extra{font-size:9px;color:var(--green);font-weight:700;margin-top:4px;}

/* بطاقات الأكاديميات */
.acad-card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;align-items:center;gap:12px;}
.acad-avatar{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--green),#0d3318);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;flex-shrink:0;}
.acad-info{flex:1;}
.acad-name{font-size:13px;font-weight:900;color:var(--dark);}
.acad-meta{font-size:10px;color:#64748b;font-weight:600;margin-top:2px;}
.acad-cats{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.cat-pill{font-size:9px;font-weight:700;padding:2px 8px;border-radius:10px;background:#f0fdf4;color:var(--green);}

/* الأزرار */
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:14px;font-weight:900;cursor:pointer;font-family:'Cairo',sans-serif;text-align:center;}
.btn-red{background:linear-gradient(135deg,var(--red),#7a0f12);color:#fff;}
.btn-green-main{background:linear-gradient(135deg,var(--green),#0d3318);color:#fff;}
.btn-gold{background:linear-gradient(135deg,var(--gold),#b8960c);color:var(--dark);}
.btn-dark{background:linear-gradient(135deg,var(--dark),#1e293b);color:#fff;}
.btn-light{background:#f1f5f9;color:#475569;}
.btn-green{background:linear-gradient(135deg,#128c7e,#25d366);color:#fff;}
.btn+.btn{margin-top:8px;}

/* النماذج */
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:12px;}
.lbl{display:block;font-size:11px;font-weight:800;color:#374151;margin-bottom:5px;}
.inp{width:100%;border:1.5px solid #e2e8f0;border-radius:10px;padding:11px 13px;font-size:13px;font-family:'Cairo',sans-serif;color:var(--dark);background:#fff;outline:none;transition:border .2s;}
.inp:focus{border-color:var(--red);}
.mb{margin-bottom:12px;}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.err{color:#b91c1c;font-size:11px;font-weight:700;margin-top:4px;}
.ok{color:#16a34a;font-size:11px;font-weight:700;margin-top:4px;}

/* التنبيهات */
.al{border-radius:10px;padding:10px 14px;font-size:12px;font-weight:700;margin-bottom:10px;}
.al-ok{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;}
.al-err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;}
.al-warn{background:#fffbeb;color:#d97706;border:1px solid #fde68a;}

/* لودينج */
.ldg{display:flex;justify-content:center;padding:40px;}
.sp{width:32px;height:32px;border:3px solid #e2e8f0;border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* الموديل */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:480px;padding:20px 16px 32px;max-height:85vh;overflow-y:auto;}
.modal-handle{width:40px;height:4px;background:#e2e8f0;border-radius:2px;margin:0 auto 18px;}
.modal-title{font-size:16px;font-weight:900;color:var(--dark);margin-bottom:16px;text-align:center;}

/* بطاقة اللاعب */
.player-card{background:linear-gradient(135deg,#0f172a,#1e293b);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
.player-num{width:32px;height:32px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:var(--dark);flex-shrink:0;}
.player-info{flex:1;}
.player-name{font-size:12px;font-weight:900;color:#fff;}
.player-meta{font-size:10px;color:rgba(255,255,255,.55);font-weight:600;}
.player-cat{font-size:9px;font-weight:800;padding:2px 8px;border-radius:8px;background:rgba(212,175,55,.2);color:var(--gold);}

/* الشريط السفلي */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;display:flex;z-index:100;}
.bn-btn{flex:1;padding:10px 4px;text-align:center;cursor:pointer;border:none;background:none;font-family:'Cairo',sans-serif;}
.bn-icon{font-size:18px;display:block;margin-bottom:2px;}
.bn-label{font-size:9px;color:#94a3b8;font-weight:700;}
.bn-btn.active .bn-label{color:var(--red);}
.bn-btn.active .bn-icon{filter:drop-shadow(0 0 4px var(--red));}
#app{padding-bottom:64px;}

/* شارة الحالة */
.status-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:800;}
.status-open{background:#dcfce7;color:#16a34a;}
.status-closed{background:#fee2e2;color:#b91c1c;}

/* قسم الفئة في إدارة الأكاديمية */
.cat-section{background:#f8fafc;border-radius:12px;padding:12px;margin-bottom:10px;border:1.5px solid #e2e8f0;}
.cat-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.cat-count{background:var(--red);color:#fff;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;}
</style>
</head>

function getCategory(birthDateStr) {
  var d = new Date(birthDateStr);
  if(isNaN(d)) return null;
  var y = d.getFullYear();
  var m = d.getMonth() + 1; // 1-12

  if(y===2017||y===2018) return 'cat1';
  if(y===2015 && m>=10)  return 'cat1';
  if(y===2015 || y===2014) return 'cat2';
  if(y===2013 && m>=10)  return 'cat2';
  if(y===2013 || y===2012) return 'cat3';
  if(y===2011 && m>=10)  return 'cat3';
  if(y===2011 || y===2010) return 'cat4';
  if(y===2009 && m>=10)  return 'cat4';
  return null;
}

function apiCall(action, data) {
  // للتوافق مع الكود القديم
  if(data && data.sheet && data.data) {
    return apiAppend(data.sheet, Array.isArray(data.data)?data.data[0]:data.data);
  }
  return apiAppend(
    action==='registerAcademy'?'الأكاديميات':action==='addPlayer'?'اللاعبون':'رسائل البطولة',
    data
  );
}

function apiAppend(sheet, rowObj) {
  if(CONFIG.GAS_URL === 'YOUR_GAS_URL_HERE') return Promise.resolve({status:'demo'});
  return fetch(CONFIG.GAS_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type': 'text/plain'},
    body: JSON.stringify({action:'append', sheet:sheet, data:[rowObj]})
  }).then(function(){ return {status:'ok'}; })
    .catch(function(){ return {status:'error'}; });
}

var _cache = {};
var _CACHE_TTL = 3 * 60 * 1000; // 3 دقائق

function apiGet(sheet, forceRefresh) {
  if(CONFIG.GAS_URL === 'YOUR_GAS_URL_HERE') return getDemoData(sheet);
  var now = Date.now();
  if(!forceRefresh && _cache[sheet] && (now - _cache[sheet].t) < _CACHE_TTL) {
    return Promise.resolve(_cache[sheet].d);
  }
  return fetch(CONFIG.GAS_URL+'?sheet='+encodeURIComponent(sheet)+'&t='+now)
    .then(function(r){return r.json();})
    .then(function(d){ _cache[sheet]={d:d,t:Date.now()}; return d; })
    .catch(function(){ return _cache[sheet]?_cache[sheet].d:[]; });
}

function invalidateCache(sheet){ delete _cache[sheet]; }

// بعد كل كتابة، امسح cache الشيت المعني
var _origApiAppend = null;
function apiAppend(sheet, rowObj) {
  if(CONFIG.GAS_URL === 'YOUR_GAS_URL_HERE') return Promise.resolve({status:'demo'});
  invalidateCache(sheet);
  return fetch(CONFIG.GAS_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type': 'text/plain'},
    body: JSON.stringify({action:'append', sheet:sheet, data:[rowObj]})
  }).then(function(){ return {status:'ok'}; })
    .catch(function(){ return {status:'error'}; });
}

function submitAcadReg() {
  var name    = (document.getElementById('rAcadName').value||'').trim();
  var city    = (document.getElementById('rCity').value||'').trim();
  var country = (document.getElementById('rCountry').value||'').trim();
  var coach   = (document.getElementById('rCoach').value||'').trim();
  var phone   = (document.getElementById('rPhone').value||'').trim();
  var email   = (document.getElementById('rEmail').value||'').trim();
  var pin     = (document.getElementById('rPin').value||'').trim();
  var pin2    = (document.getElementById('rPin2').value||'').trim();
  var cats    = CATEGORIES.filter(function(c){return document.getElementById('rCat_'+c.id).checked;}).map(function(c){return c.id;});
  var errEl   = document.getElementById('rErr');

  errEl.style.display='none';
  if(!name||!city||!country||!coach||!phone){errEl.textContent='الرجاء ملء جميع الحقول الإلزامية';errEl.style.display='block';return;}
  if(!cats.length){errEl.textContent='اختر فئة عمرية واحدة على الأقل';errEl.style.display='block';return;}
  if(pin.length!==4||isNaN(pin)){errEl.textContent='الرمز السري يجب أن يكون 4 أرقام';errEl.style.display='block';return;}

      '<div style="text-align:center;padding:40px 16px;">'+
        '<div style="font-size:64px;margin-bottom:16px;">🎉</div>'+

          '<div style="font-size:12px;font-weight:800;color:#92400e;margin-bottom:4px;"><i class="fas fa-clock"></i> قيد الاعتماد</div>'+

function doAcadLogin() {
  var phone = (document.getElementById('loginPhone').value||'').trim();
  var pin   = (document.getElementById('loginPin').value||'').trim();
  var err   = document.getElementById('loginErr');
  err.style.display='none';
  if(!phone||!pin){err.textContent='أدخل رقم الهاتف والـ PIN';err.style.display='block';return;}
  var btn = document.querySelector('#app .btn-red');
  btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> جارٍ التحقق...';

  // جلب مباشر بدون كاش
  invalidateCache('الأكاديميات');
  invalidateCache('تحديث الأكاديميات');
  apiGet('الأكاديميات').then(function(list){
    var acad = list.find(function(a){return String(a.phone)===String(phone) && String(a.pin)===String(pin);});
    btn.disabled=false; btn.innerHTML='<i class="fas fa-sign-in-alt"></i> دخول';
    if(!acad){err.textContent='رقم الهاتف أو الـ PIN غير صحيح';err.style.display='block';return;}

    // فحص الاعتماد من جدول التحديثات (الأكثر موثوقية)
    apiGet('تحديث الأكاديميات').then(function(updates){
      var latest = (updates||[]).filter(function(u){return String(u.academy_id)===String(acad.id);}).pop();
      var status = (latest && latest.status) || acad.status || 'قيد الاعتماد';
      if(status !== 'معتمد'){
        document.getElementById('app').innerHTML=
          '<div style="text-align:center;padding:60px 20px;max-width:360px;margin:0 auto;">'+
            '<div style="font-size:64px;margin-bottom:16px;">⏳</div>'+
            '<div style="font-size:18px;font-weight:900;color:#92400e;margin-bottom:8px;">طلبك قيد المراجعة</div>'+
            '<div style="background:#fef9c3;border:1.5px solid #fde68a;border-radius:12px;padding:16px;margin:16px auto;max-width:300px;">'+
              '<div style="font-size:12px;color:#78350f;font-weight:700;margin-bottom:6px;">'+acad.name+'</div>'+
              '<div style="font-size:11px;color:#92400e;">لم يتم اعتماد أكاديميتك بعد من قبل الإدارة.<br>سيتم إبلاغكم بقرار الاعتماد عبر واتساب.</div>'+
            '</div>'+
            '<button class="btn btn-light" style="max-width:300px;margin:0 auto;" onclick="go(\'acad_login\')">رجوع</button>'+
          '</div>';
        return;
      }
      sessionStorage.setItem('kaasAcadId',acad.id);
      sessionStorage.setItem('kaasAcadName',acad.name);
      sessionStorage.setItem('kaasAcadCats',acad.cats||'');
      window._kaasAcad = acad;
      go('acad_dashboard');
    });
  });
}

/* ────── محرر الصورة (اسحب + اقرص) ────── */
function openPhotoCropper(input){
  var file = input.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){ showPhotoCropper(e.target.result); };
  reader.readAsDataURL(file);
}

/* ─── محرر قص الصورة الموحّد ─── */
function _showCropper(src, onConfirm){
  var SZ = 240;
  var ov = document.createElement('div');
  ov.id = 'cropModal';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-family:Cairo,sans-serif;direction:rtl;';
  ov.innerHTML =
    '<div style="color:#d4af37;font-size:15px;font-weight:900;margin-bottom:18px;">📷 اضبط الصورة</div>'+
    '<div id="czn" style="position:relative;width:'+SZ+'px;height:'+SZ+'px;border-radius:50%;overflow:hidden;border:4px solid #d4af37;background:#0f172a;touch-action:none;">'+
      '<img id="cimg" src="'+src+'" style="position:absolute;transform-origin:0 0;max-width:none;max-height:none;" draggable="false">'+
    '</div>'+
    '<div style="color:rgba(255,255,255,.45);font-size:11px;margin:14px 0;text-align:center;">اسحب بإصبع · اقرص بإصبعين للتكبير</div>'+
    '<div style="display:flex;gap:12px;">'+
      '<button id="cropOk" style="background:#d4af37;color:#0f172a;border:none;border-radius:12px;padding:13px 32px;font-size:14px;font-weight:900;cursor:pointer;font-family:Cairo,sans-serif;">✅ تأكيد</button>'+
      '<button onclick="document.getElementById(\'cropModal\').remove()" style="background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:12px;padding:13px 24px;font-size:13px;cursor:pointer;font-family:Cairo,sans-serif;">إلغاء</button>'+
    '</div>';
  document.body.appendChild(ov);

  var img = document.getElementById('cimg');
  var czn = document.getElementById('czn');
  var tx=0, ty=0, sc=1, minSc=1;

  function init(){
    minSc = Math.max(SZ/img.naturalWidth, SZ/img.naturalHeight);
    sc = minSc;
    tx = (SZ - img.naturalWidth*sc)/2;
    ty = (SZ - img.naturalHeight*sc)/2;
    applyT();
  }
  if(img.complete && img.naturalWidth){ init(); }
  else { img.onload = init; }

  function applyT(){ img.style.transform='translate('+tx+'px,'+ty+'px) scale('+sc+')'; }

  var lx=0, ly=0, ltx=0, lty=0, ld=0, ls=1;
  czn.addEventListener('touchstart',function(e){
    e.preventDefault();
    if(e.touches.length===1){ lx=e.touches[0].clientX; ly=e.touches[0].clientY; ltx=tx; lty=ty; }
    else if(e.touches.length===2){
      ld=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);
      ls=sc; ltx=tx; lty=ty;
    }
  },{passive:false});
  czn.addEventListener('touchmove',function(e){
    e.preventDefault();
    if(e.touches.length===1){
      tx=ltx+(e.touches[0].clientX-lx);
      ty=lty+(e.touches[0].clientY-ly);
      applyT();
    } else if(e.touches.length===2 && ld){
      var d=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);
      sc=Math.max(minSc,ls*(d/ld));
      tx=SZ/2-(SZ/2-ltx)*(sc/ls);
      ty=SZ/2-(SZ/2-lty)*(sc/ls);
      applyT();
    }
  },{passive:false});

  var md=false, mx0, my0, mtx, mty;
  czn.addEventListener('mousedown',function(e){md=true;mx0=e.clientX;my0=e.clientY;mtx=tx;mty=ty;});
  document.addEventListener('mousemove',function(e){if(!md)return;tx=mtx+(e.clientX-mx0);ty=mty+(e.clientY-my0);applyT();});
  document.addEventListener('mouseup',function(){md=false;});

  document.getElementById('cropOk').onclick=function(){
    var c=document.createElement('canvas'); c.width=200; c.height=200;
    var ctx=c.getContext('2d');
    ctx.beginPath(); ctx.arc(100,100,100,0,Math.PI*2); ctx.clip();
    var r=200/SZ;
    ctx.drawImage(img, tx*r, ty*r, img.naturalWidth*sc*r, img.naturalHeight*sc*r);
    var res=c.toDataURL('image/jpeg',0.82);
    ov.remove();
    onConfirm(res);
  };
}

function showPhotoCropper(src){
  _showCropper(src, function(res){
    window._playerPhoto = res;
    var box = document.getElementById('photoPreview');
    if(box){ box.style.border='3px solid #d4af37'; box.innerHTML='<img src="'+res+'" style="width:100%;height:100%;object-fit:cover;">'; }
    var eb = document.getElementById('photoEditBtn');
    if(eb) eb.style.display='block';
  });
}

function loadPlayerDoc(input){
  var file=input.files[0];
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var MAX=800, ratio=Math.min(MAX/img.width,MAX/img.height,1);
      var c=document.createElement('canvas');
      c.width=Math.round(img.width*ratio); c.height=Math.round(img.height*ratio);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      var comp=c.toDataURL('image/jpeg',0.75);
      window._playerDoc=comp;
      var box=document.getElementById('docPreview');
      var hint=document.getElementById('docHint');
      if(box) box.innerHTML='<img src="'+comp+'" style="max-width:100%;max-height:120px;border-radius:8px;">';
      if(hint) hint.textContent='✅ تم رفع الوثيقة — اضغط لتغييرها';
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function checkPlayerCat() {
  var birth = document.getElementById('pBirth').value;
  var el = document.getElementById('catResult');
  if(!birth){el.style.display='none';return;}
  var catId = getCategory(birth);
  if(!catId){
    el.innerHTML='<div class="al al-err">❌ تاريخ الميلاد هذا لا ينتمي لأي فئة عمرية في البطولة</div>';
    el.style.display='block';return;
  }
  var cats = (sessionStorage.getItem('kaasAcadCats')||'').split(',').filter(Boolean);
  var ci = getCatInfo(catId);
  if(cats.indexOf(catId)===-1){
    el.innerHTML='<div class="al al-warn">⚠️ اللاعب ينتمي لـ <b>'+ci.name+'</b> لكن أكاديميتك لم تسجل في هذه الفئة</div>';
    el.style.display='block';return;
  }
  el.innerHTML='<div class="al al-ok">✅ الفئة: <b>'+ci.name+'</b> ('+ci.label+')</div>';
  el.style.display='block';
}

function _doSubmitPlayer(name, birth, nat, phone, health, jersey, catId, acadId, acadName){
  var playerId = 'PL'+Date.now().toString().slice(-8);
  var photo = window._playerPhoto || '';
  var doc   = window._playerDoc   || '';

  if(photo) { try{ localStorage.setItem('kaasPhoto_'+playerId, photo); }catch(e){} }
  if(doc)   { try{ localStorage.setItem('kaasDoc_'+playerId,   doc);   }catch(e){} }

  apiAppend('اللاعبون',{
    id:playerId,
    academy_id:acadId, academy_name:acadName,
    name:name, birth:birth, nationality:nat,
    jersey:jersey||'', phone:phone, health:health||'لا يوجد',
    cat_id:catId, cat_name:(getCatInfo(catId)||{}).name||'',
    has_photo: photo?'نعم':'لا',

    '🏆 *'+CONFIG.TOURNAMENT_NAME+'*\n'+

  var card = document.getElementById('kaasPlayerCard');
  if(!card){
    window.open('https://api.whatsapp.com/send?phone='+p.phone+'&text='+encodeURIComponent(msg),'_blank');
    return;
  }

  var btn = event && event.target ? event.target.closest('button') : null;
  if(btn){ btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> جارٍ الإرسال...'; }

      var file = new File([blob],'بطاقة-'+p.name+'.png',{type:'image/png'});

function captureKaasCards(players,mode,filename){
  var wrap=document.createElement('div');
  wrap.style.cssText='position:fixed;left:-9999px;top:0;width:340px;background:#f1f5f9;padding:16px;display:flex;flex-direction:column;z-index:-1;';

    div.innerHTML=buildKaasCardHTML(p,i+1);
    wrap.appendChild(div.firstChild);
  });
  document.body.appendChild(wrap);
  var ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center;';
  ov.innerHTML='<div style="background:#fff;border-radius:12px;padding:24px 32px;text-align:center;font-family:Cairo,sans-serif;"><div style="width:32px;height:32px;border:3px solid #e2e8f0;border-top-color:#b81d22;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px;"></div><div style="font-size:13px;font-weight:700;color:#0f172a;">جارٍ التحضير...</div></div>';
  document.body.appendChild(ov);
  setTimeout(function(){
    html2canvas(wrap,{useCORS:true,scale:2,backgroundColor:'#f1f5f9',logging:false}).then(function(canvas){
      ov.remove();
      document.body.removeChild(wrap);
      if(mode==='مشاركة'){
        canvas.toBlob(function(blob){
          var file=new File([blob],filename+'.png',{type:'image/png'});
          if(navigator.canShare&&navigator.canShare({files:[file]})){
            navigator.share({files:[file],title:CONFIG.TOURNAMENT_NAME,text:'بطاقات اللاعبين — '+CONFIG.TOURNAMENT_NAME});
          } else {
            var a=document.createElement('a');a.download=filename+'.png';a.href=URL.createObjectURL(blob);a.click();
            setTimeout(function(){window.open('https://api.whatsapp.com/send?text='+encodeURIComponent('بطاقات اللاعبين: '+CONFIG.TOURNAMENT_NAME),'_blank');},800);
          }
        },'image/png');
        return;
      }
      var a=document.createElement('a');a.download=filename+'.png';a.href=canvas.toDataURL('image/png');a.click();
    }).catch(function(){ov.remove();document.body.removeChild(wrap);alert('حدث خطأ، جرب الطباعة');});
  },600);
}

function saveMatchResult(){
  var team1   = (document.getElementById('mrTeam1').value||'').trim();
  var team2   = (document.getElementById('mrTeam2').value||'').trim();
  var score1  = document.getElementById('mrScore1').value||'0';
  var score2  = document.getElementById('mrScore2').value||'0';
  var date    = document.getElementById('mrDate').value;
  var time    = document.getElementById('mrTime').value;
  var venue   = (document.getElementById('mrVenue').value||'').trim();
  var catId   = document.getElementById('mrCat').value;
  var status  = document.getElementById('mrStatus').value;
  var referee = (document.getElementById('mrReferee').value||'').trim();
  var notes   = (document.getElementById('mrNotes').value||'').trim();

  if(!team1||!team2){alert('الرجاء إدخال اسمي الفريقين');return;}

  var goals=[], subs=[];
  document.querySelectorAll('.goal-row').forEach(function(r){
    var s=(r.querySelector('.goal-scorer').value||'').trim();
    var m=r.querySelector('.goal-min').value;
    var t=r.querySelector('.goal-team').value;
    if(s) goals.push({scorer:s, minute:m, team:t==='1'?team1:team2});
  });
  document.querySelectorAll('.sub-row').forEach(function(r){
    var o=(r.querySelector('.sub-out').value||'').trim();
    var i=(r.querySelector('.sub-in').value||'').trim();
    var m=r.querySelector('.sub-min').value;
    if(o||i) subs.push({out:o, in:i, minute:m});
  });

  var row = {
    match_id: 'M'+Date.now().toString().slice(-8),
    team1:team1, team2:team2, score1:score1, score2:score2,
    result: score1+' - '+score2,
    winner: parseInt(score1)>parseInt(score2)?team1:(parseInt(score2)>parseInt(score1)?team2:'تعادل'),
    date:date, time:time, venue:venue, cat_id:catId,
    status:status, referee:referee, notes:notes,
    goals: JSON.stringify(goals), subs: JSON.stringify(subs),
    saved_at: new Date().toLocaleDateString('ar')
  };

  var btn=document.querySelector('[onclick="saveMatchResult()"]');
  btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> جارٍ الحفظ...';

  apiAppend('نتائج المباريات', row).then(function(){
    btn.disabled=false; btn.innerHTML='<i class="fas fa-check"></i> تم الحفظ بنجاح!';
    btn.style.background='linear-gradient(135deg,#16a34a,#14532d)';
    /* عرض ملخص */
    var summary = '⚽ '+team1+' '+score1+' - '+score2+' '+team2;
    if(goals.length) summary += '\n\n📌 الأهداف:\n'+goals.map(function(g){return '• '+g.scorer+' ('+g.minute+'د) - '+g.team;}).join('\n');
    if(subs.length)  summary += '\n\n🔄 التبديلات:\n'+subs.map(function(s){return '• ↑'+s.in+' ↓'+s.out+' ('+s.minute+'د)';}).join('\n');
    setTimeout(function(){ alert('✅ تم حفظ النتيجة بنجاح!\n\n'+summary); go('admin_panel'); }, 400);
  });
}

function filterBpPlayers(){
  var cat=(document.getElementById('bpCat')||{}).value||'';
  var acad=(document.getElementById('bpAcad')||{}).value||'';
  var search=((document.getElementById('bpSearch')||{}).value||'').toLowerCase();
  var players=(window._bpPlayers||[]).filter(function(p){
    return (!cat||p.cat_id===cat)&&(!acad||p.academy_name===acad)&&
           (!search||(p.name||'').toLowerCase().includes(search));
  });
  var html=players.map(function(p){
    var cat=CATEGORIES.find(function(c){return c.id===p.cat_id;})||{};
    var photo=getPlayerPhoto(p.id||'');
    return '<div onclick="selectBpPlayer(\''+p.id+'\',\''+p.name.replace(/'/g,'')+'\',\''+p.academy_name+'\',\''+(cat.name||'')+'\')\" '+
      'style="display:flex;align-items:center;gap:10px;padding:10px;border:1.5px solid #e2e8f0;border-radius:10px;margin-bottom:6px;cursor:pointer;background:#fff;transition:border .15s;" '+
      'onmouseover="this.style.borderColor=\'#d4af37\'" onmouseout="this.style.borderColor=\'#e2e8f0\'">'+
      (photo?'<img src="'+photo+'" style="width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0;">':
        '<div style="width:38px;height:38px;border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;">👤</div>')+
      '<div style="flex:1;"><div style="font-weight:800;font-size:13px;">'+p.name+'</div>'+
      '<div style="font-size:10px;color:#64748b;">'+p.academy_name+' · '+(cat.label||'')+'</div></div>'+
      '<i class="fas fa-chevron-left" style="color:#cbd5e1;font-size:12px;"></i>'+
      '</div>';
  }).join('');
  var el=document.getElementById('bpPlayersList');
  if(el) el.innerHTML=html||(players.length?'':'<div style="text-align:center;padding:20px;color:#94a3b8;font-size:12px;">لا توجد نتائج</div>');
}

function selectBpPlayer(id,name,acad,cat){
  window._bpChosen={id:id,name:name,acad:acad,cat:cat};
  var info=document.getElementById('bpSelectedInfo');
  if(info) info.innerHTML='<div style="font-size:14px;font-weight:900;color:#1a1a2e;">'+name+'</div>'+
    '<div style="font-size:11px;color:#64748b;margin-top:3px;">'+acad+' · '+cat+'</div>';
  var box=document.getElementById('bpSelected');
  if(box){box.style.display='block';box.scrollIntoView({behavior:'smooth'});}

function saveBestPlayer(){
  var ch=window._bpChosen;
  if(!ch){alert('اختر لاعباً أولاً');return;}
  var title=(document.getElementById('bpTitle').value||'').trim();
  var match=(document.getElementById('bpMatch').value||'').trim();
  var row={
    player_id:ch.id, player_name:ch.name, academy_name:ch.acad,
    category:ch.cat, award_title:title, match_context:match,
    date:new Date().toLocaleDateString('ar'),
    awarded_by: sessionStorage.getItem('kaasAcadName')||'الإدارة'

  var btn=document.querySelector('[onclick="saveBestPlayer()"]');
  btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> جارٍ النشر...';
  invalidateCache('أفضل لاعب');

function saveRefereeReport(){
  var name=(document.getElementById('rfName').value||'').trim();
  var team1=(document.getElementById('rfTeam1').value||'').trim();
  var team2=(document.getElementById('rfTeam2').value||'').trim();
  if(!name){alert('أدخل اسم الحكم');return;}
  if(!team1||!team2){alert('أدخل اسمي الفريقين');return;}

  var row={
    report_id:'RF'+Date.now().toString().slice(-8),
    referee_name:name,
    assistant1:(document.getElementById('rfAs1').value||'').trim(),
    assistant2:(document.getElementById('rfAs2').value||'').trim(),
    fourth:(document.getElementById('rfFourth').value||'').trim(),
    team1:team1, team2:team2,
    score1:document.getElementById('rfScore1').value,
    score2:document.getElementById('rfScore2').value,
    date:document.getElementById('rfDate').value,
    venue:(document.getElementById('rfVenue').value||'').trim(),

    red1:document.getElementById('rfR1').value,

  apiGet('الأكاديميات').then(function(rows){
    var list=rows||[];
    window._allAcadsApproval=list;
    _renderApprovalList(list);

function _renderApprovalList(list){
  var local=_getLocalStatuses();
  // دمج القرارات المحلية مع بيانات الشيت
  list=list.map(function(a){
    if(local[a.id]) a.status=local[a.id];
    return a;
  });
  var pending=list.filter(function(a){return !a.status||a.status==='قيد الاعتماد';});
  var approved=list.filter(function(a){return a.status==='معتمد';});
  var rejected=list.filter(function(a){return a.status==='مرفوض';});

  // تحديث badge الشريط الجانبي
  var badge=document.getElementById('sidebarPendingBadge');
  if(badge){if(pending.length>0){badge.textContent=pending.length;badge.style.display='';}else{badge.style.display='none';}}

  var html='';

  // طلبات قيد الاعتماد
  html+='<div style="font-size:12px;font-weight:900;color:#92400e;background:#fef9c3;border:1px solid #fde68a;border-radius:10px;padding:10px 14px;margin-bottom:12px;">'+
    '<i class="fas fa-clock"></i> قيد الاعتماد ('+pending.length+')</div>';
  if(pending.length===0){
    html+='<div style="text-align:center;padding:20px;color:#94a3b8;font-size:12px;">لا توجد طلبات جديدة</div>';
  } else {
    pending.forEach(function(a){html+=_acadCard(a,true);});
  }

  // الأكاديميات المعتمدة
  if(approved.length>0){
    html+='<div style="font-size:12px;font-weight:900;color:#166534;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:10px 14px;margin:16px 0 10px;">'+
      '<i class="fas fa-check-circle"></i> معتمدة ('+approved.length+')</div>';
    approved.forEach(function(a){html+=_acadCard(a,false);});
  }

  // الأكاديميات المرفوضة
  if(rejected.length>0){
    html+='<div style="font-size:12px;font-weight:900;color:#991b1b;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:10px 14px;margin:16px 0 10px;">'+
      '<i class="fas fa-times-circle"></i> مرفوضة ('+rejected.length+')</div>';
    rejected.forEach(function(a){html+=_acadCard(a,false);});
  }

  document.getElementById('acadApprovalList').innerHTML=html;
}

function _getLocalStatuses(){
  try{return JSON.parse(localStorage.getItem('kaasAcadStatuses')||'{}');}catch(e){return {};}
}
function _saveLocalStatus(id,status){
  var s=_getLocalStatuses(); s[id]=status;
  localStorage.setItem('kaasAcadStatuses',JSON.stringify(s));
}

function approveAcad(id,nameEnc,phoneEnc){
  var name=decodeURIComponent(nameEnc);
  if(!confirm('اعتماد أكاديمية: '+name+'؟'))return;
  _saveLocalStatus(id,'معتمد');
  var phone=decodeURIComponent(phoneEnc);
  var loginUrl = window.location.origin+window.location.pathname+'?page=login';
  var waMsg='السلام عليكم،\n\nيسعدنا إبلاغكم بأنه تم *اعتماد '+name+'* في بطولة '+CONFIG.TOURNAMENT_NAME+' ✅\n\nيمكنكم الآن الدخول للمنصة وتسجيل لاعبيكم:\n'+loginUrl+'\n\n🆔 رقم الأكاديمية: '+id;
  var waUrl='https://api.whatsapp.com/send?phone=968'+phone+'&text='+encodeURIComponent(waMsg);
  var card=document.getElementById('acadCard_'+id);
  if(card){
    card.style.transition='all .3s';
    card.style.background='#f0fdf4';
    card.style.border='2px solid #16a34a';
    card.innerHTML='<div style="text-align:center;padding:20px;">'+
      '<div style="font-size:36px;">✅</div>'+
      '<div style="font-size:13px;font-weight:900;color:#16a34a;margin-top:8px;">تم الاعتماد</div>'+
      '<div style="font-size:11px;color:#64748b;margin-top:4px;">'+name+'</div>'+
      '<button onclick="location.href=\''+waUrl+'\'" style="margin-top:12px;background:#25d366;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:12px;font-weight:900;cursor:pointer;font-family:Cairo,sans-serif;display:flex;align-items:center;gap:6px;margin:12px auto 0;">'+
        '<i class="fab fa-whatsapp"></i> إرسال إشعار للمشرف</button>'+
    '</div>';
  }
  invalidateCache('الأكاديميات');
  apiAppend('تحديث الأكاديميات',{academy_id:id,status:'معتمد',reason:'',updated_at:new Date().toLocaleDateString('ar')});
}

function rejectAcad(id,nameEnc,phoneEnc){
  var name=decodeURIComponent(nameEnc);
  var reason=prompt('سبب الرفض (اختياري):','');
  if(reason===null)return;
  _saveLocalStatus(id,'مرفوض');
  var card=document.getElementById('acadCard_'+id);
  if(card){
    card.style.transition='all .3s';
    card.style.background='#fef2f2';
    card.style.border='2px solid #dc2626';
    card.innerHTML='<div style="text-align:center;padding:20px;"><div style="font-size:36px;">❌</div><div style="font-size:13px;font-weight:900;color:#dc2626;margin-top:8px;">تم الرفض</div><div style="font-size:11px;color:#64748b;margin-top:4px;">'+name+'</div></div>';
  }
  invalidateCache('الأكاديميات');
  apiAppend('تحديث الأكاديميات',{academy_id:id,status:'مرفوض',reason:reason,updated_at:new Date().toLocaleDateString('ar')});
}

function testGasConnection(){
  var out = document.createElement('div');
  out.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;';

    '<div style="padding:16px;" id="gasTestBody"><div style="text-align:center;padding:20px;color:#64748b;">جاري الاختبار...</div></div>'+
    '<div style="padding:12px 16px;border-top:1px solid #e2e8f0;text-align:center;">'+
      '<button onclick="this.closest(\'div[style*=fixed]\').remove()" style="background:#f1f5f9;color:#475569;border:none;border-radius:8px;padding:9px 24px;font-size:13px;font-weight:700;cursor:pointer;font-family:Cairo,sans-serif;">إغلاق</button>'+
    '</div></div>';
  document.body.appendChild(out);
  var results=[];
  function show(){
    var body=document.getElementById('gasTestBody');
    if(!body) return;
    body.innerHTML=results.map(function(r){
      return '<div style="display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #f1f5f9;">'+
        '<div style="font-size:18px;flex-shrink:0;">'+(r.ok?'✅':'❌')+'</div>'+
        '<div><div style="font-size:13px;font-weight:700;color:'+(r.ok?'#16a34a':'#b81d22')+';">'+r.title+'</div>'+
        '<div style="font-size:11px;color:#64748b;margin-top:2px;">'+r.detail+'</div></div></div>';
    }).join('')+(results.length<2?'<div style="text-align:center;padding:8px;color:#64748b;font-size:12px;">جاري المزيد...</div>':'');
  }
  fetch(CONFIG.GAS_URL+'?sheet=الأكاديميات&nocache='+Date.now())
    .then(function(r){return r.json();})
    .then(function(d){results.push({ok:true,title:'قراءة البيانات ✓',detail:'اتصال Google Sheets يعمل — '+(Array.isArray(d)?d.length:0)+' أكاديمية'});show();})
    .catch(function(e){results.push({ok:false,title:'فشل الاتصال',detail:e.message});show();});
  setTimeout(function(){
    fetch(CONFIG.GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'append',sheet:'_test',data:[{test:'ping'}]})})
      .then(function(){results.push({ok:true,title:'إرسال البيانات ✓',detail:'الإرسال إلى GAS يعمل'});show();})
      .catch(function(e){results.push({ok:false,title:'فشل الإرسال',detail:e.message});show();});
  },1000);
}

function submitAcadMessage(acid,aname){
  var text=((document.getElementById('afbText')||{}).value||'').trim();
  var mgr=((document.getElementById('afbMgr')||{}).value||'').trim()||'غير محدد';
  if(!text){alert('يرجى كتابة نص الرسالة');return;}
  var type=window._afbType||'اقتراح';
  var row={'التاريخ':new Date().toLocaleString('ar-SA'),'النوع':type,'اسم الأكاديمية':aname||acid,'اسم المسؤول':mgr,'الرسالة':text,'الحالة':'جديد'};
  var btn=document.querySelector('#app button[onclick*="submitAcadMessage"]');
  if(btn){btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> جارٍ الإرسال...';}
  apiAppend('رسائل البطولة', row).then(function(){
    var res=document.getElementById('afbRes');
    if(res){res.style.display='block';res.innerHTML=
      '<div style="background:#ecfdf5;border:1.5px solid #16a34a;border-radius:12px;padding:16px;text-align:center;">'+
        '<div style="font-size:28px;margin-bottom:6px;">✅</div>'+
        '<div style="font-size:14px;font-weight:900;color:#15803d;">تم إرسال رسالتك بنجاح!</div>'+
        '<div style="font-size:11px;color:#64748b;margin-top:4px;">ستتم مراجعتها من قبل إدارة البطولة</div>'+
      '</div>';}
    if(btn)btn.style.display='none';
  }).catch(function(){
    if(btn){btn.disabled=false;btn.innerHTML='<i class="fas fa-paper-plane"></i> إرسال الرسالة';}
    alert('حدث خطأ في الإرسال. تحقق من الاتصال.');
  });
}

              '<button onclick="selectAllMatch(true)" style="background:#0f172a;color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:Cairo,sans-serif;">تحديد الكل</button>'+

function filterMatchByAcad(){
  var acadName=(document.getElementById('mAcad').value||'').trim();
  var catId=document.getElementById('mCat').value||'';
  var players=(window._matchPlayers||[]).filter(function(p){
    var pAcad=p.academy_name||p['الأكاديمية']||'';
    var pCat=p.cat_id||p['الفئة']||'';
    return (!acadName||pAcad===acadName)&&(!catId||pCat===catId);
  });
  var listDiv=document.getElementById('matchPlayersList');
  var items=document.getElementById('matchPlayerItems');
  if(!acadName&&!catId){listDiv.style.display='none';items.innerHTML='';updateMatchCount();return;}
  listDiv.style.display='block';
  items.innerHTML=players.map(function(p){
    var name=p.name||p['اسم اللاعب']||'';
    var cat=CATEGORIES.find(function(c){return c.id===(p.cat_id||p['الفئة']);});
    return '<label style="display:flex;align-items:center;gap:10px;padding:10px;border:1.5px solid #e2e8f0;border-radius:8px;margin-bottom:6px;cursor:pointer;background:#fff;">'+
      '<input type="checkbox" class="match-chk" value="'+name+'" onchange="updateMatchCount()" style="width:18px;height:18px;cursor:pointer;">'+
      '<div><div style="font-weight:700;font-size:13px;">'+name+'</div>'+
      '<div style="font-size:10px;color:#64748b;">'+(p.birth||p['تاريخ الميلاد']||'')+(cat?' · '+cat.label:'')+'</div></div>'+
      '</label>';
  }).join('');
  updateMatchCount();
}

function selectAllMatch(val){
  document.querySelectorAll('.match-chk').forEach(function(c){c.checked=val;});
  updateMatchCount();
}

function updateMatchCount(){
  var n=document.querySelectorAll('.match-chk:checked').length;
  var el=document.getElementById('matchCount');
  if(!el) return;
  el.style.display=n?'block':'none';
  el.textContent='✅ تم اختيار '+n+' لاعب';
}

function sendMatchListWA(){
  var opponent=(document.getElementById('mOpponent').value||'').trim();
  var date=document.getElementById('mDate').value;
  var time=document.getElementById('mTime').value;
  var venue=(document.getElementById('mVenue').value||'').trim();
  var acad=(document.getElementById('mAcad').value||'').trim();
  var selected=[];
  document.querySelectorAll('.match-chk:checked').forEach(function(c){selected.push(c.value);});
  if(!opponent){alert('أدخل اسم الفريق المنافس');return;}
  if(!selected.length){alert('اختر لاعباً واحداً على الأقل');return;}
  var dateStr=date?new Date(date).toLocaleDateString('ar-SA'):'';
  var msg='🏆 *'+CONFIG.TOURNAMENT_NAME+'*\n';
  if(acad) msg+='🏫 *'+acad+'*\n';
  msg+='⚽ *قائمة المباراة*\n━━━━━━━━━━━━━━\n';
  if(opponent) msg+='🆚 المنافس: *'+opponent+'*\n';
  if(dateStr)  msg+='📅 التاريخ: '+dateStr+'\n';
  if(time)     msg+='⏰ الوقت: '+time+'\n';
  if(venue)    msg+='📍 الملعب: '+venue+'\n';
  msg+='━━━━━━━━━━━━━━\n👕 *اللاعبون ('+selected.length+')*\n';
  selected.forEach(function(name,i){msg+=(i+1)+'. '+name+'\n';});
  msg+='━━━━━━━━━━━━━━\n🇴🇲 بالتوفيق للجميع!';
  window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(msg),'_blank');
}

      '<div class="mb"><label class="lbl">ملاحظات صحية</label>'+
        '<input class="inp" id="eHealth" value="'+(player.health||'')+'"></div>'+
      '<button onclick="saveEditKaasPlayer(\''+pid+'\')" class="btn btn-red" style="margin-top:4px;">'+
        '<i class="fas fa-save"></i> حفظ التعديلات</button>'+
    '</div>';
  document.body.appendChild(ov);
  // إغلاق عند الضغط على الخلفية
  ov.addEventListener('click', function(e){ if(e.target===ov) ov.remove(); });
}

function editOpenCropper(input, pid){
  if(!input.files||!input.files[0]) return;
  var reader = new FileReader();
  reader.onload = function(e){
    _showCropper(e.target.result, function(dataUrl){
      try{ localStorage.setItem('kaasPhoto_'+pid, dataUrl); }catch(x){}
      var ring = document.getElementById('editPhotoRing');
      if(ring) ring.innerHTML = '<img src="'+dataUrl+'" style="width:100%;height:100%;object-fit:cover;">';
      window._editNewPhoto = dataUrl;
    });
  };
  reader.readAsDataURL(input.files[0]);
}

function saveEditKaasPlayer(pid){
  var name   = (document.getElementById('eName').value||'').trim();
  var birth  = (document.getElementById('eBirth').value||'').trim();
  var nat    = (document.getElementById('eNat').value||'').trim();
  var jersey = (document.getElementById('eJersey').value||'').trim();
  var phone  = (document.getElementById('ePhone').value||'').trim();
  var health = (document.getElementById('eHealth').value||'').trim();
  if(!name){ alert('اسم اللاعب مطلوب'); return; }

  // حفظ الصورة الجديدة إن وُجدت
  if(window._editNewPhoto){
    try{ localStorage.setItem('kaasPhoto_'+pid, window._editNewPhoto); }catch(x){}
    window._editNewPhoto = null;
  }

  var edit = {name:name, birth:birth, nationality:nat, jersey:jersey, phone:phone, health:health};
  try{ localStorage.setItem('kaasEdit_'+pid, JSON.stringify(edit)); }catch(x){}
  var acadId = sessionStorage.getItem('kaasAcadId');
  apiAppend('تعديلات اللاعبين', Object.assign({player_id:pid, academy_id:acadId, date:new Date().toLocaleDateString('ar')}, edit));

  document.getElementById('editModal').remove();
  invalidateCache('اللاعبون');
  go('acad_dashboard');
}

function sharePlayerWhatsapp(pid){
  var p = (window._kaasPlayers||[]).find(function(x){ return x.id===pid; });
  if(!p) return;
  var edit = {};
  try{ edit = JSON.parse(localStorage.getItem('kaasEdit_'+pid)||'{}'); }catch(e){}
  var name     = edit.name    || p.name    || '';
  var birth    = (edit.birth  || p.birth   || '').toString().split('T')[0];
  var nat      = edit.nationality || p.nationality || p.nat || '';
  var jersey   = edit.jersey  || p.jersey  || '';
  var cat      = p.cat_name   || p.catName || '';
  var acadName = sessionStorage.getItem('kaasAcadName') || p.academy_name || '';
  var msg =
    '🏆 *'+CONFIG.TOURNAMENT_NAME+'*\n'+
    '─────────────────\n'+
    '👤 *اللاعب:* '+name+'\n'+
    '🎂 *تاريخ الميلاد:* '+birth+'\n'+
    (nat    ? '🌍 *الجنسية:* '+nat+'\n'       : '')+
    (cat    ? '⚽ *الفئة:* '+cat+'\n'         : '')+
    (jersey ? '👕 *رقم القميص:* #'+jersey+'\n': '')+
    '🏫 *الأكاديمية:* '+acadName+'\n'+
    '─────────────────\n'+
    '📋 *الموسم:* '+CONFIG.SEASON;

  /* بناء بطاقة اللاعب وتحويلها إلى صورة PNG ثم مشاركتها */
  var wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;left:-9999px;top:0;width:340px;z-index:-1;background:#f1f5f9;padding:16px;';
  wrap.innerHTML = buildKaasCardHTML(p, 1);
  document.body.appendChild(wrap);

  var loadingBtn = document.querySelector('[onclick="sharePlayerWhatsapp(\''+pid+'\')"]');
  if(loadingBtn){ loadingBtn.disabled=true; loadingBtn.innerHTML='<i class="fas fa-spinner fa-spin"></i>'; }

  setTimeout(function(){
    html2canvas(wrap, {scale:2, useCORS:true, backgroundColor:'#f1f5f9', logging:false}).then(function(canvas){
      document.body.removeChild(wrap);
      if(loadingBtn){ loadingBtn.disabled=false; loadingBtn.innerHTML='<i class="fab fa-whatsapp"></i> واتساب'; }

      canvas.toBlob(function(blob){
        var file = new File([blob], 'بطاقة-'+name+'.png', {type:'image/png'});
        if(navigator.canShare && navigator.canShare({files:[file]})){
          navigator.share({files:[file], text:msg}).catch(function(){
            /* fallback: واتساب نص فقط */
            window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(msg),'_blank');
          });
        } else {
          /* fallback للمتصفحات التي لا تدعم share */
          window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(msg),'_blank');
        }
      }, 'image/png');
    }).catch(function(){
      document.body.removeChild(wrap);
      if(loadingBtn){ loadingBtn.disabled=false; loadingBtn.innerHTML='<i class="fab fa-whatsapp"></i> واتساب'; }
      window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(msg),'_blank');
    });
  }, 200);
}

function deleteKaasPlayer(pid, pname){
  if(!confirm('حذف اللاعب "'+pname+'" ؟\nلا يمكن التراجع عن هذا الإجراء.')) return;
  var acadId = sessionStorage.getItem('kaasAcadId');
  apiAppend('حذف اللاعبين', {
    player_id: pid, academy_id: acadId,
    date: new Date().toLocaleDateString('ar')
  });
  // إزالة فورية من الواجهة
  window._kaasPlayers = (window._kaasPlayers||[]).filter(function(p){ return p.id!==pid; });
  try{ localStorage.removeItem('kaasEdit_'+pid); localStorage.removeItem('kaasPhoto_'+pid); }catch(x){}
  invalidateCache('اللاعبون');
  go('acad_dashboard');
}

function shareRegLink(){
  var id   = sessionStorage.getItem('kaasAcadId');
  var name = sessionStorage.getItem('kaasAcadName');
  if(!id){ alert('يجب تسجيل الدخول أولاً'); return; }
  var base = location.href.split('?')[0];
  var link = base + '?acad=' + id;
  var msg  = '🏆 *' + CONFIG.TOURNAMENT_NAME + '*\n\n' +
             'رابط تسجيل لاعبي أكاديمية *' + name + '*\n\n' +
             '👇 اضغط الرابط لتسجيل ابنك مباشرة:\n' + link + '\n\n' +
             '✅ بعد التسجيل ستظهر بطاقة اللاعب للتحميل والمشاركة';

  // محاولة نسخ الرابط
  if(navigator.clipboard){
    navigator.clipboard.writeText(link).then(function(){}).catch(function(){});
  }

  // فتح واتساب مع الرسالة
  window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(msg), '_blank');
}

// ════════════════════════════════════════
// معالجة رابط ولي الأمر ?acad=ACID
// ════════════════════════════════════════
function handleAcadLink(){
  var params = new URLSearchParams(location.search);
  // فتح صفحة الدخول مباشرة عند ?page=login
  if(params.get('page')==='login'){go('acad_login');return true;}
  var acadId = params.get('acad');
  if(!acadId) return false;

  // تحميل بيانات الأكاديمية من الشيت
  showL();
  apiGet('الأكاديميات').then(function(list){
    var acad = (Array.isArray(list)?list:[]).find(function(a){ return String(a.id)===String(acadId); });
    if(!acad){
      document.getElementById('app').innerHTML =
        '<div style="padding:40px;text-align:center;">'+
        '<div style="font-size:40px;margin-bottom:12px;">❌</div>'+
        '<div style="font-size:15px;font-weight:900;color:#b81d22;">الرابط غير صحيح</div>'+
        '<div style="font-size:12px;color:#64748b;margin-top:6px;">تعذّر العثور على الأكاديمية</div>'+
        '<button onclick="go(\'home\')" class="btn btn-red" style="margin-top:16px;">الصفحة الرئيسية</button>'+
        '</div>';
      return;
    }
    // تعيين session مؤقت
    sessionStorage.setItem('kaasAcadId',   acad.id   || acadId);
    sessionStorage.setItem('kaasAcadName', acad.name || '');
    sessionStorage.setItem('kaasAcadCats', acad.cats || '');
    // عرض نموذج إضافة لاعب مباشرة
    go('add_player');
  }).catch(function(){
    go('home');
  });
  return true;
}

// ════════════════════════════════════════
// البدء
// ════════════════════════════════════════
if(!handleAcadLink()) go('acad_login');
</script>
